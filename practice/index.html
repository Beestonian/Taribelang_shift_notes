<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Writing one</title>
<style>
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --line:#C6D0DC; --ink:#111A24; --ink-2:#41566B; --ink-3:#63798E;
  --accent:#245C4E; --accent-ink:#FFFFFF;
  --mark-line:#B8842E;
  --ok:#15654D; --ok-soft:#E1F1EA;
  --bad:#9C3225; --bad-soft:#FAE7E4;
  --rec:#9C3225;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E141A; --surface:#18212C; --surface-2:#202B38;
    --line:#35434F; --ink:#F0F5FA; --ink-2:#BDCBD9; --ink-3:#9AACBC;
    --accent:#5FBEA1; --accent-ink:#06120E; --mark-line:#D8A441;
    --ok:#6FD0AE; --ok-soft:#16332A;
    --bad:#EC9A8C; --bad-soft:#3A211D; --rec:#EC9A8C;
  }
}
:root[data-theme="dark"]{
  --ground:#0E141A; --surface:#18212C; --surface-2:#202B38;
  --line:#35434F; --ink:#F0F5FA; --ink-2:#BDCBD9; --ink-3:#9AACBC;
  --accent:#5FBEA1; --accent-ink:#06120E; --mark-line:#D8A441;
  --ok:#6FD0AE; --ok-soft:#16332A;
  --bad:#EC9A8C; --bad-soft:#3A211D; --rec:#EC9A8C;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 56px}

.prog{margin:0 0 18px}
.prog-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.prog-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 24px 22px}
h1{font-size:27px;line-height:1.25;margin:0 0 14px;letter-spacing:-.01em}
h2.step-title{font-size:23px;line-height:1.3;margin:0 0 16px;letter-spacing:-.01em;color:var(--ink)}
.sub{color:var(--ink-2);font-size:15.5px;margin:0 0 18px}
.sub p{margin:0 0 9px}.sub p:last-child{margin:0}

.brief{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;
  padding:16px 20px;margin:0 0 18px;font-size:16px}
.brief p{margin:0 0 10px}.brief p:last-child{margin:0}
.covered{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;
  padding:28px 20px;margin:0 0 18px;font-size:15px;color:var(--ink-3);text-align:center}

.clockwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.clock{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1;color:var(--ink);min-width:112px}
.clock.idle{color:var(--ink-3)}
.clock.over{color:var(--rec)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:8px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.btn{font:inherit;font-size:15.5px;padding:11px 18px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
button.btn:hover:not(:disabled){border-color:var(--ink-3)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.btn.rec[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--rec);color:var(--rec);font-weight:600}
button.btn.rec[aria-pressed="true"] .dot{animation:pulse 1.1s infinite}
button.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.nav .spacer{margin-left:auto}
.saved{font-size:13px;color:var(--ink-3)}

.field{margin:0 0 20px}
.field-label{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:2px}
.field-q{font-size:15px;color:var(--ink-2);margin-bottom:8px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.6;padding:12px 13px;border-radius:9px;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);resize:vertical;min-height:84px}
textarea.short{min-height:64px}
textarea.tall{min-height:150px}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.hint{font-size:14px;color:var(--ink-2);margin:10px 0 0}

ul.check{list-style:none;margin:0;padding:0}
ul.check li{margin:0 0 12px}
ul.check label{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer;color:var(--ink)}
ul.check input{margin:4px 0 0;width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}

audio{width:100%;margin:14px 0 0;display:block}

/* line-by-line comparison */
.cmp{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 16px;background:var(--surface)}
.cmp h3{margin:0 0 12px;font-size:17px;color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
@media (max-width:620px){ .pair{grid-template-columns:1fr} }
.pane{border-radius:8px;padding:11px 13px;font-size:15px;white-space:pre-wrap}
.pane.mine{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.pane.mine.blank{color:var(--ink-3);font-style:italic}
.pane.theirs{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink)}
.pane-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:5px}
.model-notes{font-size:15px;color:var(--ink-2);margin:0 0 16px;padding:12px 14px;
  background:var(--surface-2);border-radius:8px}
.model-notes p{margin:0 0 9px}.model-notes p:last-child{margin:0}

.warn{background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:10px;padding:13px 15px;
  font-size:15px;color:var(--ink);margin:0 0 16px}
.warn a{color:var(--ink);font-weight:700}
details.xapi{margin-top:24px;font-size:13px;color:var(--ink-2)}
details.xapi summary{cursor:pointer;padding:8px 0;color:var(--ink-2);font-weight:600}
details.xapi pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;
  overflow:auto;max-height:340px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.err{background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:10px;padding:16px;font-size:15px}
/* step transitions */
@keyframes cardIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-14px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.card.enter{animation:cardIn .26s cubic-bezier(.2,.7,.3,1) both}
.card.leave{animation:cardOut .16s ease-in both}
.brief.reveal,.field,.cmp{animation:fadeIn .3s ease both}
.field:nth-child(2){animation-delay:.04s}.field:nth-child(3){animation-delay:.08s}
.field:nth-child(4){animation-delay:.12s}
.cmp:nth-child(2){animation-delay:.05s}.cmp:nth-child(3){animation-delay:.1s}
.cmp:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){
  .card.enter,.card.leave,.brief.reveal,.field,.cmp{animation:none !important}
}

/* in-page dialog — native confirm() is suppressed inside Rise's iframe */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.55);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50;animation:fadeIn .15s ease both}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:22px 24px;max-width:420px;width:100%;animation:popIn .2s cubic-bezier(.2,.7,.3,1) both}
.dialog h3{margin:0 0 8px;font-size:19px;color:var(--ink)}
.dialog p{margin:0 0 18px;font-size:15.5px;color:var(--ink-2)}
.dialog .row{justify-content:flex-end}
@media (prefers-reduced-motion:reduce){ .scrim,.dialog{animation:none !important} }

.foot{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:18px 2px 0}
button.linkbtn{font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--ink-2);
  text-decoration:underline;cursor:pointer}
button.linkbtn:hover{color:var(--ink)}
button.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot-note{font-size:13px;color:var(--ink-3)}

.editor{background:var(--surface);border:2px solid var(--mark-line);border-radius:12px;padding:20px 22px;margin:0 0 24px}
.editor label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);margin:14px 0 5px}
.editor input,.editor textarea{width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);min-height:auto}
.editor textarea{min-height:74px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.editor fieldset{border:1px solid var(--line);border-radius:9px;padding:0 16px 16px;margin:18px 0 0}
.editor legend{font-size:15px;font-weight:700;padding:0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading&hellip;</p></div>

<script>
(function(){
  "use strict";

  /* ==================================================================
     xAPI 1.0.3. No LRS yet — statements are built to spec, kept in
     memory, mirrored to localStorage, and shown at the foot of the
     page. Set LRS below and they POST instead.
     ================================================================== */
  var LRS = null;            // e.g. {endpoint:"https://…/xAPI/", auth:"Basic …"}
  var STORE_KEY = "xapi:practice:statements";
  var statements = [];

  function actorId(){
    var k="xapi:actor", v=null;
    try{ v = localStorage.getItem(k); }catch(e){}
    if(!v){ v = "anon-" + Math.random().toString(36).slice(2,10);
            try{ localStorage.setItem(k,v); }catch(e){} }
    return v;
  }
  function actor(){
    return { objectType:"Agent", name:"Anonymous learner",
             account:{ homePage:location.origin + location.pathname, name:actorId() } };
  }
  function iso(ms){ return "PT" + (Math.round(Math.max(0,ms/1000)*100)/100) + "S"; }
  function emit(verbId, verbLabel, extra){
    var st = {
      id:(window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())+Math.random(),
      actor:actor(), verb:{ id:verbId, display:{ "en-US":verbLabel } },
      object:extra.object, timestamp:new Date().toISOString(), version:"1.0.3"
    };
    if(extra.result)  st.result  = extra.result;
    if(extra.context) st.context = extra.context;
    statements.push(st);
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(statements)); }catch(e){}
    if(window.console && console.debug) console.debug("[xAPI]", verbLabel, st);
    if(LRS && LRS.endpoint){
      try{
        fetch(LRS.endpoint + "statements", { method:"POST",
          headers:{ "Content-Type":"application/json", "X-Experience-API-Version":"1.0.3",
                    "Authorization": LRS.auth || "" },
          body: JSON.stringify(st) }).catch(function(){});
      }catch(e){}
    }
    renderXapi();
    return st;
  }
  var V = {
    initialized:"http://adlnet.gov/expapi/verbs/initialized",
    attempted:"http://adlnet.gov/expapi/verbs/attempted",
    experienced:"http://adlnet.gov/expapi/verbs/experienced",
    responded:"http://adlnet.gov/expapi/verbs/responded",
    answered:"http://adlnet.gov/expapi/verbs/answered",
    completed:"http://adlnet.gov/expapi/verbs/completed",
    exited:"http://adlnet.gov/expapi/verbs/exited"
  };
  function activityId(){ return (DATA && DATA.activityId) || (location.origin + location.pathname); }
  function roundObject(r, kind, desc, itype){
    return { id: activityId() + "#" + r.id + "/" + kind, objectType:"Activity",
      definition:{ name:{ "en-US": r.label + " — " + r.client + " — " + kind },
                   description:{ "en-US": desc },
                   type:"http://adlnet.gov/expapi/activities/cmi.interaction",
                   interactionType: itype || "long-fill-in" } };
  }
  function ctx(){ return { contextActivities:{ parent:[{ id:activityId(), objectType:"Activity" }] } }; }

  /* ==================================================================
     Content. rounds.json loads the same way the branching scenario
     loads its scenario. ?r=name swaps in rounds-name.json.
     ================================================================== */
  var DATA = null, started = Date.now();

  function roundsFile(){
    var m = /[?&]r=([A-Za-z0-9_-]{1,40})(?:&|$)/.exec(location.search);
    return m ? "rounds-" + m[1] + ".json" : "rounds.json";
  }
  function load(){
    try{
      var x = new XMLHttpRequest();
      x.open("GET", roundsFile() + "?t=" + Date.now(), false);
      x.send(null);
      if(x.status >= 200 && x.status < 300) return JSON.parse(x.responseText);
    }catch(e){}
    return null;
  }

  /* ==================================================================
     Learner work, kept in localStorage.
     ================================================================== */
  var WORK_KEY = "practice:work", POS_KEY = "practice:pos";
  var work = {};
  function loadWork(){ try{ work = JSON.parse(localStorage.getItem(WORK_KEY)||"{}")||{}; }catch(e){ work={}; } }
  function saveWork(){
    try{ localStorage.setItem(WORK_KEY, JSON.stringify(work)); }catch(e){}
    var s = document.getElementById("saved");
    if(s){ s.textContent = "Saved";
           clearTimeout(saveWork._t);
           saveWork._t = setTimeout(function(){ if(s) s.textContent=""; }, 2500); }
  }
  function w(rid){
    var d = work[rid];
    if(!d) d = work[rid] = {};
    if(!d.note) d.note = {};
    if(!d.feedback) d.feedback = {};
    if(!d.checks) d.checks = [];
    if(d.revision == null) d.revision = "";
    if(d.spokeSeconds == null) d.spokeSeconds = 0;
    return d;
  }
  function savePos(){ try{ localStorage.setItem(POS_KEY, JSON.stringify(pos)); }catch(e){} }
  function loadPos(){
    try{ var p = JSON.parse(localStorage.getItem(POS_KEY)||"null");
         if(p && typeof p.r === "number" && typeof p.s === "number") return p; }catch(e){}
    return { r:0, s:0 };
  }

  /* ==================================================================
     Audio — MediaRecorder only. Nothing is uploaded.
     ================================================================== */
  function pickMime(){
    if(!window.MediaRecorder) return null;
    var tries = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus",""];
    for(var i=0;i<tries.length;i++){
      if(tries[i]==="" || MediaRecorder.isTypeSupported(tries[i])) return tries[i];
    }
    return null;
  }
  function extFor(mime){
    if(!mime) return "webm";
    if(mime.indexOf("mp4") > -1) return "m4a";
    if(mime.indexOf("ogg") > -1) return "ogg";
    return "webm";
  }
  var audioStore = {};

  /* ==================================================================
     Downloads
     ================================================================== */
  function download(blob, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      return true;
    }catch(e){ return false; }
  }
  function strip(html){
    var d = document.createElement("div"); d.innerHTML = html || "";
    return (d.textContent||"").replace(/\n{3,}/g,"\n\n").trim();
  }
  function fields(){ return DATA.fields || []; }
  function allText(){
    var out = [DATA.title, new Date().toLocaleString(), ""];
    DATA.rounds.forEach(function(r){
      var d = w(r.id);
      out.push("==========================================================");
      out.push(r.label.toUpperCase() + " — " + r.client);
      out.push("==========================================================", "");
      out.push("THE SHIFT", strip(r.brief), "");
      if(d.spokeSeconds) out.push("I SPOKE FOR: " + d.spokeSeconds + " seconds", "");
      out.push("MY NOTE");
      fields().forEach(function(f){
        out.push("  " + f.label + ": " + ((d.note[f.key]||"").trim() || "(blank)"));
      });
      out.push("", "MY OWN CHECK");
      (r.checklist || DATA.checklistDefault).forEach(function(item,i){
        out.push("  [" + (d.checks.indexOf(i)>-1 ? "x" : " ") + "] " + item);
      });
      out.push("", "ONE WAY TO WRITE IT, AND WHAT I'D CHANGE");
      fields().forEach(function(f){
        out.push("  " + f.label);
        out.push("    Mine:  " + ((d.note[f.key]||"").trim() || "(blank)"));
        out.push("    Model: " + (((r.modelFields||{})[f.key]||"").trim() || "(blank)"));
        out.push("    I'd change: " + ((d.feedback[f.key]||"").trim() || "(nothing)"));
      });
      if(r.modelNotes) out.push("", strip(r.modelNotes));
      out.push("", "THE ONE THING I CHANGED", d.revision || "(blank)", "", "");
    });
    return out.join("\n");
  }
  function copyAll(text){
    text = text || allText();
    function done(){ alert("Copied."); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text, done); });
    } else legacyCopy(text, done);
  }
  function legacyCopy(text, cb){
    var t = document.createElement("textarea");
    t.value = text; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); cb(); }catch(e){ alert("Select the text and copy it manually."); }
    document.body.removeChild(t);
  }

  /* ==================================================================
     Helpers
     ================================================================== */
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html != null) e.innerHTML = html;
    return e;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function mmss(sec){
    var neg = sec < 0; sec = Math.abs(Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (neg?"+":"") + m + ":" + (s<10?"0":"") + s;
  }
  /* Native confirm() is suppressed inside a sandboxed iframe, so it
     fails silently. Everything that needs a yes uses this instead. */
  function ask(heading, message, yesLabel, onYes){
    var scrim = el("div","scrim");
    var dlg = el("div","dialog");
    dlg.setAttribute("role","alertdialog");
    dlg.setAttribute("aria-modal","true");
    dlg.appendChild(el("h3",null, esc(heading)));
    dlg.appendChild(el("p",null, esc(message)));
    var row = el("div","row");
    var no = el("button","btn","Cancel"); no.type = "button";
    var yes = el("button","btn primary", esc(yesLabel)); yes.type = "button";
    row.appendChild(no); row.appendChild(yes);
    dlg.appendChild(row);
    scrim.appendChild(dlg);
    function close(){
      document.removeEventListener("keydown", onKey);
      if(scrim.parentNode) scrim.parentNode.removeChild(scrim);
    }
    function onKey(e){ if(e.key === "Escape") close(); }
    no.addEventListener("click", close);
    scrim.addEventListener("click", function(e){ if(e.target === scrim) close(); });
    document.addEventListener("keydown", onKey);
    yes.addEventListener("click", function(){ close(); onYes(); });
    document.body.appendChild(scrim);
    yes.focus();
  }

  function ta(value, cls, oninput){
    var t = document.createElement("textarea");
    if(cls) t.className = cls;
    t.value = value || "";
    t.addEventListener("input", function(){ oninput(t.value); });
    return t;
  }

  /* Theme. ?theme=light|dark forces one; the external link carries
     whichever the learner is currently looking at. */
  function applyTheme(){
    var m = /[?&]theme=(light|dark)(?:&|$)/.exec(location.search);
    if(m) document.documentElement.setAttribute("data-theme", m[1]);
  }
  function effectiveTheme(){
    var set = document.documentElement.getAttribute("data-theme");
    if(set) return set;
    try{ if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) return "dark"; }catch(e){}
    return "light";
  }
  function externalHref(){
    var q = location.search.replace(/[?&](theme=[^&]*|edit(=[^&]*)?)/g,"").replace(/^&/,"");
    if(q && q.charAt(0) !== "?") q = "?" + q.replace(/^\?/,"");
    q = q ? q + "&" : "?";
    return location.origin + location.pathname + q + "theme=" + effectiveTheme();
  }

  /* ==================================================================
     Steps — one task per screen, forward only.
     ================================================================== */
  var STEPS = ["read","speak","write","check","compare","revise"];
  var STEP_TITLES = {
    read:"Read the shift", speak:"Say your note out loud", write:"Write it down",
    check:"Check your own", compare:"Compare", revise:"Change one thing"
  };
  var pos = { r:0, s:0 };
  var micBlocked = false;
  var live = null;

  function teardown(){
    if(live){
      try{ if(live.rec && live.rec.state === "recording") live.rec.stop(); }catch(e){}
      if(live.stream) live.stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(live.tick);
      live = null;
    }
  }
  function go(r, s){
    teardown();
    var old = app.querySelector(".card");
    function land(){
      if(s != null) pos.s = s;
      if(r != null) pos.r = r;
      savePos(); paint(); window.scrollTo(0,0);
    }
    var reduce = false;
    try{ reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    if(old && !reduce){
      old.classList.remove("enter");
      old.classList.add("leave");
      setTimeout(land, 150);
    } else land();
  }
  function next(){
    if(pos.s < STEPS.length - 1) return go(null, pos.s + 1);
    if(pos.r < DATA.rounds.length - 1) return go(pos.r + 1, 0);
    return go(DATA.rounds.length, 0);
  }

  /* ---------- 1. read ---------- */
  function stepRead(r, body, nav){
    var secs = r.readSeconds || 60;
    var holder = el("div","covered", "You'll get " + mmss(secs) + " with this shift.");
    body.appendChild(holder);

    var cw = el("div","clockwrap");
    var clock = el("span","clock idle", mmss(secs));
    cw.appendChild(clock);
    body.appendChild(cw);

    var startBtn = el("button","btn primary","Start"); startBtn.type = "button";
    var doneBtn = el("button","btn primary","Next"); doneBtn.type = "button"; doneBtn.hidden = true;
    doneBtn.addEventListener("click", next);

    startBtn.addEventListener("click", function(){
      startBtn.hidden = true; doneBtn.hidden = false;
      holder.className = "brief reveal"; holder.innerHTML = r.brief;
      clock.classList.remove("idle");
      var left = secs;
      var tick = setInterval(function(){
        left--;
        clock.textContent = mmss(left);
        if(left <= 0){ clearInterval(tick); next(); }
      }, 1000);
      live = { tick: tick };
      emit(V.experienced, "experienced", {
        object: roundObject(r, "brief", "Read the shift under a self-started time limit.", "other"),
        result: { duration: iso(secs*1000) }, context: ctx() });
    });
    nav.appendChild(startBtn); nav.appendChild(doneBtn);
  }

  /* ---------- 2. speak ---------- */
  function stepSpeak(r, body, nav){
    var d = w(r.id);
    var cw = el("div","clockwrap");
    var clock = el("span","clock idle", r.timerSeconds > 0 ? mmss(r.timerSeconds) : "0:00");
    cw.appendChild(clock);
    body.appendChild(cw);

    var warn = el("div","warn",""); warn.hidden = true;
    body.appendChild(warn);

    var row = el("div","row");
    var recBtn = el("button","btn rec primary","Record");
    recBtn.type = "button"; recBtn.setAttribute("aria-pressed","false");
    var clockBtn = el("button","btn primary","Start"); clockBtn.type = "button"; clockBtn.hidden = true;
    var dlBtn = el("button","btn","Download recording");
    dlBtn.type = "button"; dlBtn.disabled = !audioStore[r.id];
    row.appendChild(recBtn); row.appendChild(clockBtn); row.appendChild(dlBtn);
    body.appendChild(row);

    var audio = document.createElement("audio");
    audio.controls = true; audio.hidden = !audioStore[r.id];
    if(audioStore[r.id]) audio.src = audioStore[r.id].url;
    body.appendChild(audio);

    var st = { rec:null, chunks:[], stream:null, t0:0, tick:null, elapsed:0 };
    live = st;

    function paintClock(){
      st.elapsed = Math.round((Date.now() - st.t0)/1000);
      if(r.timerSeconds > 0){
        var l = r.timerSeconds - st.elapsed;
        clock.textContent = mmss(l < 0 ? -l : l);
        clock.classList.toggle("over", l < 0);
      } else clock.textContent = mmss(st.elapsed);
    }
    function showBlocked(){
      micBlocked = true;
      warn.hidden = false;
      warn.innerHTML = "The microphone is blocked inside an embedded page. " +
        '<a href="' + esc(externalHref()) + '" target="_blank" rel="noopener">Open in a new tab</a> to record, ' +
        "or say it out loud and press Start.";
      recBtn.hidden = true;
      clockBtn.hidden = false;
    }
    clockBtn.addEventListener("click", function(){
      if(st.tick){
        clearInterval(st.tick); st.tick = null;
        clockBtn.textContent = "Start";
        d.spokeSeconds = st.elapsed; saveWork();
        return;
      }
      st.t0 = Date.now(); clock.classList.remove("idle"); paintClock();
      st.tick = setInterval(paintClock, 250);
      clockBtn.textContent = "Stop";
    });
    function stop(){
      try{ st.rec.stop(); }catch(e){}
      if(st.stream) st.stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(st.tick); st.tick = null;
      recBtn.setAttribute("aria-pressed","false");
      recBtn.textContent = "Record again";
    }
    recBtn.addEventListener("click", function(){
      if(st.rec && st.rec.state === "recording"){ stop(); return; }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
        showBlocked(); return;
      }
      navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
        var mime = pickMime();
        st.stream = stream; st.chunks = [];
        try{ st.rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
        catch(e){ st.rec = new MediaRecorder(stream); }
        st.rec.ondataavailable = function(e){ if(e.data && e.data.size) st.chunks.push(e.data); };
        st.rec.onstop = function(){
          var blob = new Blob(st.chunks, { type: st.rec.mimeType || "audio/webm" });
          if(audioStore[r.id]) URL.revokeObjectURL(audioStore[r.id].url);
          audioStore[r.id] = { blob:blob, url:URL.createObjectURL(blob) };
          audio.src = audioStore[r.id].url; audio.hidden = false; dlBtn.disabled = false;
          d.spokeSeconds = st.elapsed; saveWork();
          emit(V.responded, "responded", {
            object: roundObject(r, "spoken-note", "Spoken note, held in the browser and not transmitted."),
            result:{ duration: iso(st.elapsed*1000), response:"[audio held locally, " + st.elapsed + "s]" },
            context: ctx() });
        };
        st.rec.start();
        st.t0 = Date.now(); clock.classList.remove("idle"); paintClock();
        st.tick = setInterval(paintClock, 250);
        recBtn.setAttribute("aria-pressed","true");
        recBtn.innerHTML = '<span class="dot"></span>Stop';
        warn.hidden = true;
        emit(V.attempted, "attempted", {
          object: roundObject(r, "spoken-note", "Started speaking the note."), context: ctx() });
      }).catch(showBlocked);
    });
    dlBtn.addEventListener("click", function(){
      var a = audioStore[r.id];
      if(a) download(a.blob, "shift-note-" + r.id + "." + extFor(a.blob.type));
    });
    if(micBlocked) showBlocked();

    var done = el("button","btn primary","Next"); done.type = "button";
    done.addEventListener("click", next);
    nav.appendChild(done);
  }

  /* ---------- 3. write ---------- */
  function stepWrite(r, body, nav){
    var d = w(r.id);
    if(audioStore[r.id]){
      var a = document.createElement("audio");
      a.controls = true; a.src = audioStore[r.id].url;
      a.style.margin = "0 0 18px";
      body.appendChild(a);
    }
    fields().forEach(function(f){
      var fd = el("div","field");
      fd.appendChild(el("div","field-label", esc(f.label)));
      if(f.question) fd.appendChild(el("div","field-q", esc(f.question)));
      fd.appendChild(ta(d.note[f.key], null, function(v){ d.note[f.key] = v; saveWork(); }));
      body.appendChild(fd);
    });
    var done = el("button","btn primary","Next"); done.type = "button";
    done.addEventListener("click", function(){
      var any = fields().some(function(f){ return (d.note[f.key]||"").trim(); });
      if(any){
        var resp = fields().map(function(f){
          return f.label + ": " + ((d.note[f.key]||"").trim() || "(blank)"); }).join("\n");
        emit(V.responded, "responded", {
          object: roundObject(r, "written-note", "The learner's own note, under the ShiftCare headings."),
          result:{ response: resp }, context: ctx() });
      }
      next();
    });
    nav.appendChild(done);
  }

  /* ---------- 4. check ---------- */
  function stepCheck(r, body, nav){
    var d = w(r.id);
    var items = r.checklist || DATA.checklistDefault;
    var list = el("ul","check");
    items.forEach(function(item,i){
      var li = document.createElement("li"), lab = document.createElement("label");
      var cb = document.createElement("input"); cb.type = "checkbox";
      cb.checked = d.checks.indexOf(i) > -1;
      cb.addEventListener("change", function(){
        var at = d.checks.indexOf(i);
        if(cb.checked && at < 0) d.checks.push(i);
        if(!cb.checked && at > -1) d.checks.splice(at,1);
        saveWork();
      });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(item));
      li.appendChild(lab); list.appendChild(li);
    });
    body.appendChild(list);
    var done = el("button","btn primary","Next"); done.type = "button";
    done.addEventListener("click", function(){
      emit(V.answered, "answered", {
        object: roundObject(r, "self-check", "Self-assessment against the checklist, submitted before the model was shown.", "choice"),
        result:{ response: d.checks.slice().sort(function(a,b){return a-b;}).join("[,]"),
                 completion:true,
                 extensions:{
                   "https://beestonian.github.io/Taribelang_shift_notes/x/self-reported":true,
                   "https://beestonian.github.io/Taribelang_shift_notes/x/items-ticked":d.checks.length,
                   "https://beestonian.github.io/Taribelang_shift_notes/x/items-total":items.length } },
        context: ctx() });
      next();
    });
    nav.appendChild(done);
  }

  /* ---------- 5. compare, heading by heading ---------- */
  function stepCompare(r, body, nav){
    var d = w(r.id), mf = r.modelFields || {};
    fields().forEach(function(f){
      var box = el("div","cmp");
      box.appendChild(el("h3",null, esc(f.label)));
      var pair = el("div","pair");

      var left = document.createElement("div");
      left.appendChild(el("div","pane-label","You wrote"));
      var mine = (d.note[f.key]||"").trim();
      left.appendChild(el("div", mine ? "pane mine" : "pane mine blank", mine ? esc(mine) : "You left this blank"));

      var right = document.createElement("div");
      right.appendChild(el("div","pane-label","One way to write it"));
      right.appendChild(el("div","pane theirs", esc((mf[f.key]||"").trim() || "—")));

      pair.appendChild(left); pair.appendChild(right);
      box.appendChild(pair);
      box.appendChild(el("div","pane-label","What would you change?"));
      box.appendChild(ta(d.feedback[f.key], "short", function(v){ d.feedback[f.key] = v; saveWork(); }));
      body.appendChild(box);
    });
    if(r.modelNotes) body.appendChild(el("div","model-notes", r.modelNotes));

    var done = el("button","btn primary","Next"); done.type = "button";
    done.addEventListener("click", function(){
      var any = fields().some(function(f){ return (d.feedback[f.key]||"").trim(); });
      if(any){
        var resp = fields().map(function(f){
          return f.label + ": " + ((d.feedback[f.key]||"").trim() || "(nothing)"); }).join("\n");
        emit(V.responded, "responded", {
          object: roundObject(r, "self-feedback", "The learner's own critique, heading by heading, against the model."),
          result:{ response: resp }, context: ctx() });
      }
      next();
    });
    nav.appendChild(done);
  }

  /* ---------- 6. revise ---------- */
  function stepRevise(r, body, nav){
    var d = w(r.id);
    body.appendChild(ta(d.revision, "tall", function(v){ d.revision = v; saveWork(); }));
    var last = pos.r === DATA.rounds.length - 1;
    var done = el("button","btn primary", last ? "Finish" : "Next round"); done.type = "button";
    done.addEventListener("click", function(){
      if((d.revision||"").trim()){
        emit(V.responded, "responded", {
          object: roundObject(r, "revision", "One targeted revision after comparing against the model."),
          result:{ response: d.revision }, context: ctx() });
      }
      emit(V.completed, "completed", {
        object: roundObject(r, "round", "Completed the loop for this round.", "other"),
        result:{ completion:true }, context: ctx() });
      next();
    });
    nav.appendChild(done);
  }

  var RENDER = { read:stepRead, speak:stepSpeak, write:stepWrite,
                 check:stepCheck, compare:stepCompare, revise:stepRevise };

  /* ---------- close ---------- */
  function renderClose(){
    var card = el("section","card");
    card.appendChild(el("h1",null, esc(DATA.close.heading)));
    card.appendChild(el("div","sub", DATA.close.body));
    var row = el("div","row");
    var dl = el("button","btn primary","Download my notes"); dl.type="button";
    dl.addEventListener("click", function(){
      var text = allText();
      var ok = download(new Blob([text],{type:"text/plain;charset=utf-8"}), "my-shift-notes.txt");
      emit(V.completed, "completed", {
        object:{ id:activityId(), objectType:"Activity",
                 definition:{ name:{ "en-US":DATA.title },
                              type:"http://adlnet.gov/expapi/activities/lesson" } },
        result:{ completion:true, duration: iso(Date.now()-started) } });
      if(!ok) copyAll(text);
    });
    var cp = el("button","btn","Copy"); cp.type="button";
    cp.addEventListener("click", function(){ copyAll(); });
    row.appendChild(dl); row.appendChild(cp);
    card.appendChild(row);
    var nav = el("div","nav");
    nav.appendChild(el("span","spacer",""));
    var again = el("button","btn","Start again"); again.type="button";
    again.addEventListener("click", function(){
      ask("Start over?",
          "This will clear your progress — your notes, your recordings and your place. Are you sure?",
          "Clear and start over",
          function(){ resetAll(); go(0,0); });
    });
    nav.appendChild(again);
    card.appendChild(nav);
    return card;
  }

  /* ==================================================================
     Paint
     ================================================================== */
  var app = document.getElementById("app");

  function renderXapi(){
    var pre = document.getElementById("xapi-log");
    if(pre) pre.textContent = JSON.stringify(statements, null, 2);
  }

  function paint(){
    app.innerHTML = "";
    if(/[?&]edit(?:&|=|$)/.test(location.search)) app.appendChild(renderEditor());

    if(pos.r >= DATA.rounds.length){
      app.appendChild(renderClose());
    } else {
      var r = DATA.rounds[pos.r], key = STEPS[pos.s];

      var prog = el("div","prog");
      var line = el("div","prog-line");
      line.appendChild(el("span",null, esc(r.label) + " &middot; " + esc(r.client)));
      line.appendChild(el("span",null, (pos.s+1) + " / " + STEPS.length));
      prog.appendChild(line);
      var bar = el("div","prog-bar");
      var total = DATA.rounds.length * STEPS.length;
      bar.appendChild(el("i",null,"")).style.width =
        Math.round((pos.r*STEPS.length + pos.s)/total*100) + "%";
      prog.appendChild(bar);
      app.appendChild(prog);

      var card = el("section","card enter");
      card.appendChild(el("h2","step-title", esc(STEP_TITLES[key])));
      var body = el("div",null,"");
      card.appendChild(body);

      var nav = el("div","nav");
      nav.appendChild(el("span","spacer",""));
      var sv = el("span","saved",""); sv.id = "saved"; nav.appendChild(sv);
      RENDER[key](r, body, nav);
      card.appendChild(nav);
      app.appendChild(card);
    }

    app.appendChild(footer());

    var d = el("details","xapi");
    d.innerHTML = '<summary>xAPI statements generated by this activity</summary><pre id="xapi-log"></pre>';
    app.appendChild(d);
    renderXapi();
  }

  /* Soft gating only — nothing stops a screenshot. What this does
     guarantee is that "start over" really is over: work, position,
     recordings and statements all go. */
  function resetAll(){
    try{
      localStorage.removeItem(WORK_KEY);
      localStorage.removeItem(POS_KEY);
      localStorage.removeItem(STORE_KEY);
    }catch(e){}
    Object.keys(audioStore).forEach(function(k){
      try{ URL.revokeObjectURL(audioStore[k].url); }catch(e){}
      delete audioStore[k];
    });
    statements = [];
    work = {};
    micBlocked = false;
    started = Date.now();
  }
  function footer(){
    var f = el("div","foot");
    var b = el("button","linkbtn","Start over");
    b.type = "button";
    b.addEventListener("click", function(){
      ask("Start over?",
          "This will clear your progress — your notes, your recordings and your place. Are you sure?",
          "Clear and start over",
          function(){ resetAll(); go(0,0); });
    });
    f.appendChild(b);
    f.appendChild(el("span","foot-note","Clears everything on this device."));
    return f;
  }

  /* ==================================================================
     Author mode — ?edit
     ================================================================== */
  function renderEditor(){
    var box = el("section","editor");
    box.appendChild(el("h2",null,"Author mode"));
    box.appendChild(el("p","hint","Edit, preview, then download <code>rounds.json</code> and commit it over the one in <code>practice/</code>."));
    var refs = { rounds:[], fields:[] };

    function field(parent, label, value, opts){
      parent.appendChild(el("label",null,label));
      var i;
      if(opts && opts.number){ i = document.createElement("input"); i.type="number"; i.min="0"; }
      else if(opts && opts.short){ i = document.createElement("input"); i.type="text"; }
      else i = document.createElement("textarea");
      i.value = value == null ? "" : value;
      parent.appendChild(i);
      return i;
    }
    function fs(legend){
      var f = document.createElement("fieldset");
      f.appendChild(el("legend",null,legend));
      box.appendChild(f); return f;
    }

    var ff = fs("Note headings and their questions");
    (DATA.fields||[]).forEach(function(f,i){
      var o = { key:f.key };
      o.label = field(ff,"Heading " + (i+1), f.label, {short:true});
      o.question = field(ff,"Question under it", f.question, {short:true});
      refs.fields[i] = o;
    });

    var fd = fs("Default checklist (one per line)");
    refs.checkDefault = field(fd,"Items",(DATA.checklistDefault||[]).join("\n"));

    DATA.rounds.forEach(function(r,idx){
      var f = fs(r.label + " — " + r.client), o = { model:{} };
      o.label = field(f,"Label",r.label,{short:true});
      o.client = field(f,"Client and shift",r.client,{short:true});
      o.readSeconds = field(f,"Reading time, seconds",r.readSeconds,{number:true});
      o.timerSeconds = field(f,"Speaking limit, seconds (0 = no limit)",r.timerSeconds,{number:true});
      o.brief = field(f,"The shift (HTML)",r.brief);
      o.checklist = field(f,"Self-check items (one per line, blank = default)",(r.checklist||[]).join("\n"));
      (DATA.fields||[]).forEach(function(fl){
        o.model[fl.key] = field(f,"Example — " + fl.label, (r.modelFields||{})[fl.key]);
      });
      o.modelNotes = field(f,"Commentary under the comparison (HTML)",r.modelNotes);
      refs.rounds[idx] = o;
    });

    var fc = fs("Close");
    refs.closeHeading = field(fc,"Heading",DATA.close.heading,{short:true});
    refs.closeBody = field(fc,"Body (HTML)",DATA.close.body);

    function collect(){
      var out = JSON.parse(JSON.stringify(DATA));
      out.fields = refs.fields.map(function(o){
        return { key:o.key, label:o.label.value, question:o.question.value }; });
      out.checklistDefault = refs.checkDefault.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      out.rounds.forEach(function(r,i){
        var o = refs.rounds[i];
        r.label = o.label.value; r.client = o.client.value;
        r.readSeconds = parseInt(o.readSeconds.value,10) || 0;
        r.timerSeconds = parseInt(o.timerSeconds.value,10) || 0;
        r.brief = o.brief.value;
        var cl = o.checklist.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
        if(cl.length) r.checklist = cl; else delete r.checklist;
        r.modelFields = {};
        Object.keys(o.model).forEach(function(k){ r.modelFields[k] = o.model[k].value; });
        r.modelNotes = o.modelNotes.value;
      });
      out.close.heading = refs.closeHeading.value;
      out.close.body = refs.closeBody.value;
      return out;
    }

    var row = el("div","row"); row.style.marginTop = "18px";
    var prev = el("button","btn","Preview from round one"); prev.type="button";
    prev.addEventListener("click", function(){ DATA = collect(); go(0,0); });
    var save = el("button","btn primary","Download rounds.json"); save.type="button";
    save.addEventListener("click", function(){
      var json = JSON.stringify(collect(), null, 2) + "\n";
      if(!download(new Blob([json],{type:"application/json"}),"rounds.json"))
        legacyCopy(json, function(){ alert("Download blocked — the JSON is on your clipboard instead."); });
    });
    var wipe = el("button","btn","Clear learner work"); wipe.type="button";
    wipe.addEventListener("click", function(){
      ask("Clear learner work?",
          "This will clear everything typed into this browser.",
          "Clear it",
          function(){ resetAll(); go(0,0); });
    });
    row.appendChild(prev); row.appendChild(save); row.appendChild(wipe);
    box.appendChild(row);
    return box;
  }

  /* ==================================================================
     Boot
     ================================================================== */
  applyTheme();
  DATA = load();
  if(!DATA || !DATA.rounds || !DATA.rounds.length){
    app.innerHTML = '<div class="err"><b>Couldn\'t load the rounds.</b><br>Expected <code>' +
      esc(roundsFile()) + '</code> next to this page.</div>';
    return;
  }
  loadWork();
  /* ?reset wipes and drops back to a clean URL — for testing, and for
     handing the same device to the next person. */
  if(/[?&]reset(?:&|=|$)/.test(location.search)){
    resetAll();
    var clean = location.search.replace(/[?&]reset(=[^&]*)?/g,"").replace(/^&/,"?");
    if(clean === "?" ) clean = "";
    if(clean && clean.charAt(0) !== "?") clean = "?" + clean;
    location.replace(location.origin + location.pathname + clean);
    return;
  }
  pos = loadPos();
  if(pos.r > DATA.rounds.length) pos = { r:0, s:0 };
  if(pos.s >= STEPS.length) pos.s = 0;
  paint();
  emit(V.initialized, "initialized", {
    object:{ id:activityId(), objectType:"Activity",
             definition:{ name:{ "en-US":DATA.title },
                          type:"http://adlnet.gov/expapi/activities/lesson" } } });
  window.addEventListener("pagehide", function(){
    teardown();
    emit(V.exited, "exited", {
      object:{ id:activityId(), objectType:"Activity" },
      result:{ duration: iso(Date.now()-started) } });
  });
})();
</script>
</body>
