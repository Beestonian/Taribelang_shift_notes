<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Writing one</title>
<style>
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB;
  --line:#D2DAE4; --ink:#16202B; --ink-2:#55677A; --ink-3:#8493A4;
  --accent:#2F6F5E; --accent-ink:#FFFFFF;
  --mark:#FBE6C8; --mark-line:#D9A441;
  --ok:#1C7A5E; --ok-soft:#E3F3EC;
  --bad:#B03A2B; --bad-soft:#FBE9E6;
  --rec:#B03A2B;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10151C; --surface:#171E27; --surface-2:#1D2530;
    --line:#2B3642; --ink:#E6ECF3; --ink-2:#A7B6C6; --ink-3:#7A8B9C;
    --accent:#4FA88E; --accent-ink:#08130F;
    --mark:#5A4620; --mark-line:#C6903A;
    --ok:#5FC2A1; --ok-soft:#17332A;
    --bad:#E2887A; --bad-soft:#361F1C;
    --rec:#E2887A;
  }
}
:root[data-theme="dark"]{
  --ground:#10151C; --surface:#171E27; --surface-2:#1D2530;
  --line:#2B3642; --ink:#E6ECF3; --ink-2:#A7B6C6; --ink-3:#7A8B9C;
  --accent:#4FA88E; --accent-ink:#08130F;
  --mark:#5A4620; --mark-line:#C6903A;
  --ok:#5FC2A1; --ok-soft:#17332A;
  --bad:#E2887A; --bad-soft:#361F1C;
  --rec:#E2887A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 64px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 2px}
.lede{color:var(--ink-2);font-size:15px;margin:0 0 22px}
.lede p{margin:0 0 8px}
.round{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 20px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.rhead .client{color:var(--ink-2);font-size:15px}
.tnote{font-size:14px;color:var(--ink-3);margin:0 0 14px}
.brief{background:var(--surface-2);border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:12px 16px;margin:0 0 16px;font-size:15px}
.brief p{margin:0 0 9px}.brief p:last-child{margin:0}
.prompt{font-weight:600;margin:0 0 14px}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.step-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.btn{font:inherit;font-size:15px;padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn:hover:not(:disabled){border-color:var(--ink-3)}
button.btn:disabled{opacity:.45;cursor:default}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.btn.rec[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--rec);color:var(--rec);font-weight:600}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{font-family:var(--mono);font-size:17px;color:var(--ink-2);min-width:74px}
.clock.over{color:var(--rec);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:7px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.recording .dot{animation:pulse 1.1s infinite}
audio{width:100%;margin-top:11px;display:block}
textarea{width:100%;font:inherit;font-size:15px;line-height:1.6;padding:11px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:vertical;min-height:118px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:13.5px;color:var(--ink-3);margin:7px 0 0}
ul.check{list-style:none;margin:0;padding:0}
ul.check li{margin:0 0 7px}
ul.check label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
ul.check input{margin:4px 0 0;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto}
.model{background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:14px 16px;font-size:15px}
.model p{margin:0 0 9px}.model p:last-child{margin:0}
.model-notes{font-size:14.5px;color:var(--ink-2);margin-top:12px}
.model-notes p{margin:0 0 8px}.model-notes p:last-child{margin:0}
.locked{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;color:var(--ink-3)}
.close{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:18px 20px;margin:0 0 20px}
.saved{font-size:13px;color:var(--ink-3);margin-left:auto}
details.xapi{margin-top:26px;font-size:13px;color:var(--ink-2)}
details.xapi summary{cursor:pointer;padding:8px 0;color:var(--ink-3)}
details.xapi pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:340px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.err{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:16px;font-size:15px}
.warn{background:var(--surface-2);border:1px solid var(--mark-line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink-2);margin:0 0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* author mode */
.editor{background:var(--surface);border:2px solid var(--mark-line);border-radius:10px;padding:18px 20px;margin:0 0 24px}
.editor h2{margin-bottom:10px}
.editor label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 5px}
.editor input[type=text],.editor input[type=number],.editor textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;
  border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.editor textarea{min-height:80px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.editor fieldset{border:1px solid var(--line);border-radius:8px;padding:0 16px 16px;margin:16px 0 0}
.editor legend{font-size:14px;font-weight:600;padding:0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lede">Loading&hellip;</p></div>

<script>
(function(){
  "use strict";

  /* ==================================================================
     xAPI. Built to 1.0.3. There is no LRS to send to yet, so statements
     are kept in memory, mirrored to localStorage, and shown in the panel
     at the foot of the page. Set LRS below and they POST instead.
     ================================================================== */
  var LRS = null;            // e.g. {endpoint:"https://…/xAPI/", auth:"Basic …"}
  var STORE_KEY = "xapi:practice:statements";
  var statements = [];

  function actorId(){
    var k="xapi:actor", v=null;
    try{ v = localStorage.getItem(k); }catch(e){}
    if(!v){
      v = "anon-" + Math.random().toString(36).slice(2,10);
      try{ localStorage.setItem(k,v); }catch(e){}
    }
    return v;
  }
  function actor(){
    return { objectType:"Agent", name:"Anonymous learner",
             account:{ homePage:location.origin + location.pathname, name:actorId() } };
  }
  function iso(ms){
    var s = Math.max(0, ms/1000);
    return "PT" + (Math.round(s*100)/100) + "S";
  }
  function emit(verbId, verbLabel, extra){
    var st = {
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())+Math.random(),
      actor: actor(),
      verb: { id: verbId, display: { "en-US": verbLabel } },
      object: extra.object,
      timestamp: new Date().toISOString(),
      version: "1.0.3"
    };
    if(extra.result)  st.result  = extra.result;
    if(extra.context) st.context = extra.context;
    statements.push(st);
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(statements)); }catch(e){}
    if(window.console && console.debug) console.debug("[xAPI]", verbLabel, st);
    if(LRS && LRS.endpoint){
      try{
        fetch(LRS.endpoint + "statements", {
          method:"POST",
          headers:{ "Content-Type":"application/json", "X-Experience-API-Version":"1.0.3",
                    "Authorization": LRS.auth || "" },
          body: JSON.stringify(st)
        }).catch(function(){});
      }catch(e){}
    }
    renderXapi();
    return st;
  }
  var V = {
    initialized:"http://adlnet.gov/expapi/verbs/initialized",
    attempted:"http://adlnet.gov/expapi/verbs/attempted",
    responded:"http://adlnet.gov/expapi/verbs/responded",
    answered:"http://adlnet.gov/expapi/verbs/answered",
    completed:"http://adlnet.gov/expapi/verbs/completed",
    exited:"http://adlnet.gov/expapi/verbs/exited"
  };
  function activityId(){ return (DATA && DATA.activityId) || (location.origin + location.pathname); }
  function roundObject(r, kind, desc){
    return {
      id: activityId() + "#" + r.id + "/" + kind,
      objectType: "Activity",
      definition: {
        name:{ "en-US": r.label + " — " + r.client + " — " + kind },
        description:{ "en-US": desc },
        type:"http://adlnet.gov/expapi/activities/cmi.interaction",
        interactionType: (kind === "self-check") ? "choice" : "long-fill-in"
      }
    };
  }
  function ctx(){
    return { contextActivities:{ parent:[{ id:activityId(), objectType:"Activity" }] } };
  }

  /* ==================================================================
     Content. Loads rounds.json the same way the branching scenario
     loads scenarios/default.json — ?r=name swaps in a variant file.
     ================================================================== */
  var DATA = null, started = Date.now();

  function roundsFile(){
    var m = /[?&]r=([A-Za-z0-9_-]{1,40})(?:&|$)/.exec(location.search);
    return m ? "rounds-" + m[1] + ".json" : "rounds.json";
  }
  function load(){
    try{
      var x = new XMLHttpRequest();
      x.open("GET", roundsFile() + "?t=" + Date.now(), false);
      x.send(null);
      if(x.status >= 200 && x.status < 300) return JSON.parse(x.responseText);
    }catch(e){}
    return null;
  }

  /* ==================================================================
     Learner work. Everything typed is kept in localStorage so a closed
     tab, a flat battery or a lost iframe does not destroy the session.
     ================================================================== */
  var WORK_KEY = "practice:work";
  var work = {};
  function loadWork(){
    try{ work = JSON.parse(localStorage.getItem(WORK_KEY) || "{}") || {}; }catch(e){ work = {}; }
  }
  function saveWork(){
    try{ localStorage.setItem(WORK_KEY, JSON.stringify(work)); }catch(e){}
    var s = document.getElementById("saved");
    if(s){
      s.textContent = "Saved " + new Date().toLocaleTimeString();
      clearTimeout(saveWork._t);
      saveWork._t = setTimeout(function(){ if(s) s.textContent=""; }, 4000);
    }
  }
  function w(rid){
    if(!work[rid]) work[rid] = { transcript:"", checks:[], reflection:"", revision:"", seconds:0, revealed:false };
    return work[rid];
  }

  /* ==================================================================
     Audio. MediaRecorder only — no upload, no transcription service.
     The blob lives in this tab and nowhere else.
     ================================================================== */
  var recorders = {};

  function pickMime(){
    if(!window.MediaRecorder) return null;
    var tries = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus",""];
    for(var i=0;i<tries.length;i++){
      if(tries[i]==="" || MediaRecorder.isTypeSupported(tries[i])) return tries[i];
    }
    return null;
  }
  function extFor(mime){
    if(!mime) return "webm";
    if(mime.indexOf("mp4") > -1) return "m4a";
    if(mime.indexOf("ogg") > -1) return "ogg";
    return "webm";
  }

  function setupRecorder(r, els){
    var state = { rec:null, chunks:[], stream:null, blob:null, url:null,
                  t0:0, tick:null, elapsed:0 };
    recorders[r.id] = state;

    function fmt(sec){
      var neg = sec < 0; sec = Math.abs(Math.round(sec));
      var m = Math.floor(sec/60), s = sec % 60;
      return (neg ? "+" : "") + m + ":" + (s<10?"0":"") + s;
    }
    function paint(){
      var el = Math.round((Date.now() - state.t0)/1000);
      state.elapsed = el;
      if(r.timerSeconds > 0){
        var left = r.timerSeconds - el;
        els.clock.textContent = fmt(left < 0 ? -left : left);
        els.clock.classList.toggle("over", left < 0);
      } else {
        els.clock.textContent = fmt(el);
      }
    }

    els.rec.addEventListener("click", function(){
      if(state.rec && state.rec.state === "recording"){ stop(); return; }
      start();
    });

    function start(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
        els.recErr.textContent = "This browser won't record audio here. Say your note out loud anyway, then type what you said below — that's the part that matters.";
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
        var mime = pickMime();
        state.stream = stream;
        state.chunks = [];
        try{ state.rec = mime ? new MediaRecorder(stream, { mimeType:mime }) : new MediaRecorder(stream); }
        catch(e){ state.rec = new MediaRecorder(stream); }
        state.rec.ondataavailable = function(e){ if(e.data && e.data.size) state.chunks.push(e.data); };
        state.rec.onstop = function(){
          state.blob = new Blob(state.chunks, { type: state.rec.mimeType || "audio/webm" });
          if(state.url) URL.revokeObjectURL(state.url);
          state.url = URL.createObjectURL(state.blob);
          els.audio.src = state.url;
          els.audio.hidden = false;
          els.dl.disabled = false;
          w(r.id).seconds = state.elapsed;
          saveWork();
          emit(V.responded, "responded", {
            object: roundObject(r, "recording", "Spoken note, recorded in the browser and not transmitted."),
            result: { duration: iso(state.elapsed*1000), response: "[audio recorded locally, " + state.elapsed + "s]" },
            context: ctx()
          });
        };
        state.rec.start();
        state.t0 = Date.now();
        paint();
        state.tick = setInterval(paint, 250);
        els.rec.setAttribute("aria-pressed","true");
        els.rec.innerHTML = '<span class="dot"></span>Stop';
        els.card.classList.add("recording");
        els.recErr.textContent = "";
        emit(V.attempted, "attempted", {
          object: roundObject(r, "recording", "Started speaking the note."),
          context: ctx()
        });
      }).catch(function(){
        els.recErr.textContent = "No microphone access. Say your note out loud anyway, then type what you said below — that's the part that matters.";
      });
    }
    function stop(){
      try{ state.rec.stop(); }catch(e){}
      if(state.stream) state.stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(state.tick);
      els.rec.setAttribute("aria-pressed","false");
      els.rec.textContent = "Record again";
      els.card.classList.remove("recording");
    }

    els.dl.addEventListener("click", function(){
      if(!state.blob) return;
      var name = "shift-note-" + r.id + "." + extFor(state.blob.type);
      download(state.blob, name);
    });
  }

  /* ==================================================================
     Downloads. Blob + <a download>. Some embedded iframes block that,
     so every download has a clipboard fallback and nothing is lost
     either way — it is all still in localStorage.
     ================================================================== */
  function download(blob, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      return true;
    }catch(e){ return false; }
  }
  function strip(html){
    var d = document.createElement("div"); d.innerHTML = html;
    return (d.textContent || "").replace(/\n{3,}/g,"\n\n").trim();
  }
  function transcriptText(){
    var out = [];
    out.push(DATA.title);
    out.push(new Date().toLocaleString());
    out.push("");
    DATA.rounds.forEach(function(r){
      var d = w(r.id);
      out.push("=".repeat(58));
      out.push(r.label.toUpperCase() + " — " + r.client);
      out.push("=".repeat(58));
      out.push("");
      out.push("THE SHIFT");
      out.push(strip(r.brief));
      out.push("");
      out.push("HOW LONG IT TOOK: " + (d.seconds ? d.seconds + " seconds" : "not recorded"));
      out.push("");
      out.push("WHAT I SAID");
      out.push(d.transcript || "(nothing written down)");
      out.push("");
      out.push("MY OWN CHECK");
      (r.checklist || DATA.checklistDefault).forEach(function(item, i){
        out.push("  [" + (d.checks.indexOf(i) > -1 ? "x" : " ") + "] " + item);
      });
      out.push("");
      out.push("WHAT I'D CHANGE");
      out.push(d.reflection || "(blank)");
      out.push("");
      out.push("ONE WAY TO WRITE IT");
      out.push(strip(r.model));
      if(r.modelNotes){ out.push(""); out.push(strip(r.modelNotes)); }
      out.push("");
      out.push("MY REVISION");
      out.push(d.revision || "(blank)");
      out.push("");
      out.push("");
    });
    return out.join("\n");
  }

  /* ==================================================================
     Render
     ================================================================== */
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html != null) e.innerHTML = html;
    return e;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function renderRound(r){
    var d = w(r.id);
    var card = el("section","round");
    var head = el("div","rhead");
    head.appendChild(el("h2",null, esc(r.label)));
    head.appendChild(el("span","client", esc(r.client)));
    card.appendChild(head);
    if(r.timerNote) card.appendChild(el("p","tnote", esc(r.timerNote)));
    card.appendChild(el("div","brief", r.brief));
    if(r.prompt) card.appendChild(el("p","prompt", esc(r.prompt)));

    /* --- 1. record --- */
    var s1 = el("div","step");
    s1.appendChild(el("div","step-label","1 · Say it out loud"));
    var row = el("div","row");
    var recBtn = el("button","btn rec primary","Record");
    recBtn.type="button"; recBtn.setAttribute("aria-pressed","false");
    var clock = el("span","clock", r.timerSeconds > 0 ? "" : "0:00");
    if(r.timerSeconds > 0){
      var m = Math.floor(r.timerSeconds/60), s = r.timerSeconds % 60;
      clock.textContent = m + ":" + (s<10?"0":"") + s;
    }
    var dlBtn = el("button","btn","Download recording");
    dlBtn.type="button"; dlBtn.disabled = true;
    row.appendChild(recBtn); row.appendChild(clock); row.appendChild(dlBtn);
    s1.appendChild(row);
    var audio = document.createElement("audio"); audio.controls = true; audio.hidden = true;
    s1.appendChild(audio);
    var recErr = el("p","hint","");
    s1.appendChild(recErr);
    s1.appendChild(el("p","hint","The recording stays in this browser. It is not uploaded anywhere."));
    card.appendChild(s1);

    /* --- 2. transcribe --- */
    var s2 = el("div","step");
    s2.appendChild(el("div","step-label","2 · Play it back and write down what you actually said"));
    var ta = document.createElement("textarea");
    ta.value = d.transcript || "";
    ta.placeholder = "Type what you hear yourself say. Not a tidied-up version — what you actually said.";
    ta.addEventListener("input", function(){ d.transcript = ta.value; saveWork(); });
    ta.addEventListener("change", function(){
      if(!ta.value.trim()) return;
      emit(V.responded, "responded", {
        object: roundObject(r, "transcript", "Learner's own note, transcribed from their recording."),
        result: { response: ta.value },
        context: ctx()
      });
    });
    s2.appendChild(ta);
    card.appendChild(s2);

    /* --- 3. self-check --- */
    var s3 = el("div","step");
    s3.appendChild(el("div","step-label","3 · Check it yourself, before you see anyone else's"));
    var list = el("ul","check");
    var items = r.checklist || DATA.checklistDefault;
    items.forEach(function(item, i){
      var li = document.createElement("li");
      var lab = document.createElement("label");
      var cb = document.createElement("input"); cb.type="checkbox";
      cb.checked = d.checks.indexOf(i) > -1;
      cb.addEventListener("change", function(){
        var at = d.checks.indexOf(i);
        if(cb.checked && at < 0) d.checks.push(i);
        if(!cb.checked && at > -1) d.checks.splice(at,1);
        saveWork();
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(item));
      li.appendChild(lab); list.appendChild(li);
    });
    s3.appendChild(list);
    card.appendChild(s3);

    /* --- 4. self-feedback --- */
    var s4 = el("div","step");
    s4.appendChild(el("div","step-label","4 · Your own feedback"));
    s4.appendChild(el("p","hint","Before you look at ours. What would you change, and why?"));
    var ref = document.createElement("textarea");
    ref.value = d.reflection || "";
    ref.placeholder = "Anything you'd cut, anything you concluded rather than saw, anything the next worker still wouldn't know.";
    ref.addEventListener("input", function(){ d.reflection = ref.value; saveWork(); });
    s4.appendChild(ref);
    card.appendChild(s4);

    /* --- 5. model, gated --- */
    var s5 = el("div","step");
    s5.appendChild(el("div","step-label","5 · One way to write it"));
    var holder = el("div",null,"");
    var gate = el("div","locked","Finish your own first. This opens when you've written something down and ticked your own check.");
    var open = el("button","btn","Show one way to write it");
    open.type = "button";
    function modelHtml(){
      var h = '<div class="model">' + r.model + '</div>';
      if(r.modelNotes) h += '<div class="model-notes">' + r.modelNotes + '</div>';
      return h;
    }
    function reveal(){
      holder.innerHTML = modelHtml();
      var s6 = el("div","step");
      s6.appendChild(el("div","step-label","6 · Change one thing in yours"));
      var rev = document.createElement("textarea");
      rev.value = d.revision || "";
      rev.placeholder = "Not a rewrite. One change.";
      rev.addEventListener("input", function(){ d.revision = rev.value; saveWork(); });
      rev.addEventListener("change", function(){
        if(!rev.value.trim()) return;
        emit(V.responded, "responded", {
          object: roundObject(r, "revision", "One targeted revision after comparing against the model."),
          result: { response: rev.value },
          context: ctx()
        });
      });
      s6.appendChild(rev);
      holder.appendChild(s6);
      d.revealed = true; saveWork();
      emit(V.answered, "answered", {
        object: roundObject(r, "self-check", "Learner's self-assessment against the checklist, submitted before the model was shown."),
        result: {
          response: d.checks.slice().sort(function(a,b){return a-b;}).join("[,]"),
          completion: true,
          duration: iso(Date.now() - started),
          extensions: {
            "https://beestonian.github.io/Taribelang_shift_notes/x/self-reported": true,
            "https://beestonian.github.io/Taribelang_shift_notes/x/items-ticked": d.checks.length,
            "https://beestonian.github.io/Taribelang_shift_notes/x/items-total": items.length
          }
        },
        context: ctx()
      });
    }
    function refreshGate(){
      var ready = (d.transcript || "").trim().length > 0 && d.checks.length > 0;
      open.disabled = !ready;
      gate.hidden = ready;
    }
    open.addEventListener("click", function(){ open.hidden = true; gate.hidden = true; reveal(); });
    s5.appendChild(gate); s5.appendChild(open); s5.appendChild(holder);
    card.appendChild(s5);
    ta.addEventListener("input", refreshGate);
    list.addEventListener("change", refreshGate);
    refreshGate();
    if(d.revealed){ open.hidden = true; gate.hidden = true; holder.innerHTML = modelHtml();
      var s6b = el("div","step");
      s6b.appendChild(el("div","step-label","6 · Change one thing in yours"));
      var rev2 = document.createElement("textarea");
      rev2.value = d.revision || "";
      rev2.placeholder = "Not a rewrite. One change.";
      rev2.addEventListener("input", function(){ d.revision = rev2.value; saveWork(); });
      s6b.appendChild(rev2);
      holder.appendChild(s6b);
    }

    setupRecorder(r, { rec:recBtn, clock:clock, dl:dlBtn, audio:audio, recErr:recErr, card:card });
    return card;
  }

  function renderClose(){
    var c = el("section","close");
    c.appendChild(el("h2",null, esc(DATA.close.heading)));
    c.appendChild(el("div",null, DATA.close.body));
    var row = el("div","row");
    var dl = el("button","btn primary","Download my three notes");
    dl.type = "button";
    dl.addEventListener("click", function(){
      var text = transcriptText();
      var ok = download(new Blob([text], {type:"text/plain;charset=utf-8"}), "my-shift-notes.txt");
      emit(V.completed, "completed", {
        object: { id: activityId(), objectType:"Activity",
                  definition:{ name:{ "en-US": DATA.title },
                               type:"http://adlnet.gov/expapi/activities/lesson" } },
        result: { completion:true, duration: iso(Date.now() - started) }
      });
      if(!ok) copyAll();
    });
    var cp = el("button","btn","Copy to clipboard");
    cp.type = "button";
    cp.addEventListener("click", copyAll);
    row.appendChild(dl); row.appendChild(cp);
    row.appendChild(el("span","saved","")).id = "saved";
    c.appendChild(row);
    c.appendChild(el("p","hint","If the download doesn't start, use Copy to clipboard and paste it into your phone's notes. Your work is also saved in this browser until you clear it."));
    return c;
  }
  function copyAll(){
    var text = transcriptText();
    function done(){ alert("Copied. Paste it wherever you keep your notes."); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text, done); });
    } else legacyCopy(text, done);
  }
  function legacyCopy(text, cb){
    var t = document.createElement("textarea");
    t.value = text; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); cb(); }catch(e){ alert("Select the text and copy it manually."); }
    document.body.removeChild(t);
  }

  function renderXapi(){
    var pre = document.getElementById("xapi-log");
    if(!pre) return;
    pre.textContent = JSON.stringify(statements, null, 2);
  }

  /* ==================================================================
     Author mode — ?edit. Exposes every round as editable fields and
     hands back a rounds.json to commit. Learners never see this.
     ================================================================== */
  function renderEditor(){
    var box = el("section","editor");
    box.appendChild(el("h2",null,"Author mode"));
    box.appendChild(el("p","hint","Edit anything below, preview it, then download <code>rounds.json</code> and commit it over the one in <code>practice/</code>. Nothing here is saved to the server."));

    function field(parent, label, value, opts){
      parent.appendChild(el("label",null, label));
      var i;
      if(opts && opts.number){ i = document.createElement("input"); i.type="number"; i.min="0"; }
      else if(opts && opts.short){ i = document.createElement("input"); i.type="text"; }
      else { i = document.createElement("textarea"); if(opts && opts.rows) i.rows = opts.rows; }
      i.value = value == null ? "" : value;
      parent.appendChild(i);
      return i;
    }

    var refs = { rounds:[] };
    var fsIntro = document.createElement("fieldset");
    fsIntro.appendChild(el("legend",null,"Intro"));
    refs.introHeading = field(fsIntro, "Heading", DATA.intro.heading, {short:true});
    refs.introBody = field(fsIntro, "Body (HTML)", DATA.intro.body);
    box.appendChild(fsIntro);

    var fsDef = document.createElement("fieldset");
    fsDef.appendChild(el("legend",null,"Default checklist (one per line)"));
    refs.checkDefault = field(fsDef, "Items", (DATA.checklistDefault||[]).join("\n"));
    box.appendChild(fsDef);

    DATA.rounds.forEach(function(r, idx){
      var fs = document.createElement("fieldset");
      fs.appendChild(el("legend",null, r.label + " — " + r.client));
      var o = {};
      o.label = field(fs, "Label", r.label, {short:true});
      o.client = field(fs, "Client and shift", r.client, {short:true});
      o.timerSeconds = field(fs, "Timer, seconds (0 = no timer)", r.timerSeconds, {number:true});
      o.timerNote = field(fs, "Timer note", r.timerNote, {short:true});
      o.brief = field(fs, "The shift (HTML)", r.brief);
      o.prompt = field(fs, "Prompt", r.prompt, {short:true});
      o.checklist = field(fs, "Self-check items (one per line, blank = use default)", (r.checklist||[]).join("\n"));
      o.model = field(fs, "Example note (HTML)", r.model);
      o.modelNotes = field(fs, "Commentary under the example (HTML)", r.modelNotes);
      refs.rounds[idx] = o;
      box.appendChild(fs);
    });

    var fsClose = document.createElement("fieldset");
    fsClose.appendChild(el("legend",null,"Close"));
    refs.closeHeading = field(fsClose, "Heading", DATA.close.heading, {short:true});
    refs.closeBody = field(fsClose, "Body (HTML)", DATA.close.body);
    box.appendChild(fsClose);

    function collect(){
      var out = JSON.parse(JSON.stringify(DATA));
      out.intro.heading = refs.introHeading.value;
      out.intro.body = refs.introBody.value;
      out.checklistDefault = refs.checkDefault.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      out.rounds.forEach(function(r, i){
        var o = refs.rounds[i];
        r.label = o.label.value;
        r.client = o.client.value;
        r.timerSeconds = parseInt(o.timerSeconds.value,10) || 0;
        r.timerNote = o.timerNote.value;
        r.brief = o.brief.value;
        r.prompt = o.prompt.value;
        var cl = o.checklist.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
        if(cl.length) r.checklist = cl; else delete r.checklist;
        r.model = o.model.value;
        r.modelNotes = o.modelNotes.value;
      });
      out.close.heading = refs.closeHeading.value;
      out.close.body = refs.closeBody.value;
      return out;
    }

    var row = el("div","row");
    var prev = el("button","btn","Preview changes"); prev.type="button";
    prev.addEventListener("click", function(){
      DATA = collect();
      try{ localStorage.removeItem(WORK_KEY); }catch(e){}
      loadWork(); paint();
      window.scrollTo(0,0);
    });
    var save = el("button","btn primary","Download rounds.json"); save.type="button";
    save.addEventListener("click", function(){
      var json = JSON.stringify(collect(), null, 2) + "\n";
      if(!download(new Blob([json],{type:"application/json"}), "rounds.json")){
        legacyCopy(json, function(){ alert("Download blocked — the JSON is on your clipboard instead."); });
      }
    });
    var wipe = el("button","btn","Clear learner work"); wipe.type="button";
    wipe.addEventListener("click", function(){
      if(!confirm("Clear all recordings-in-progress and typed answers from this browser?")) return;
      try{ localStorage.removeItem(WORK_KEY); }catch(e){}
      loadWork(); paint(); window.scrollTo(0,0);
    });
    row.appendChild(prev); row.appendChild(save); row.appendChild(wipe);
    box.appendChild(row);
    return box;
  }

  /* ==================================================================
     Boot
     ================================================================== */
  var app = document.getElementById("app");

  function paint(){
    app.innerHTML = "";
    if(/[?&]edit(?:&|=|$)/.test(location.search)) app.appendChild(renderEditor());
    app.appendChild(el("h1",null, esc(DATA.intro.heading)));
    app.appendChild(el("div","lede", DATA.intro.body));
    if(!window.MediaRecorder || !navigator.mediaDevices){
      app.appendChild(el("div","warn","This browser won't record audio. Everything else works — say your note out loud, then type what you said."));
    }
    DATA.rounds.forEach(function(r){ app.appendChild(renderRound(r)); });
    app.appendChild(renderClose());
    var d = el("details","xapi");
    d.innerHTML = '<summary>xAPI statements generated by this activity</summary><pre id="xapi-log"></pre>';
    app.appendChild(d);
    renderXapi();
  }

  DATA = load();
  if(!DATA || !DATA.rounds || !DATA.rounds.length){
    app.innerHTML = '<div class="err"><b>Couldn\'t load the rounds.</b><br>' +
      'Expected <code>' + esc(roundsFile()) + '</code> next to this page.</div>';
    return;
  }
  loadWork();
  paint();
  emit(V.initialized, "initialized", {
    object: { id: activityId(), objectType:"Activity",
              definition:{ name:{ "en-US": DATA.title },
                           type:"http://adlnet.gov/expapi/activities/lesson" } }
  });
  window.addEventListener("pagehide", function(){
    emit(V.exited, "exited", {
      object: { id: activityId(), objectType:"Activity" },
      result: { duration: iso(Date.now() - started) }
    });
  });
})();
</script>
</body>
</html>
