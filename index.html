<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Why the shift ran late</title>
<meta name="description" content="A self-contained branching scenario, built with Switchback.">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Switchback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
/* ============================================================
   Switchback — tokens
   Light palette is the complete set; dark redefines the same
   names only. Nothing is defined for the first time inside a
   media query or a [data-theme] block.
   ============================================================ */
:root{
  --ground:#EEF1F5;
  --canvas:#E3E8EF;
  --surface:#FFFFFF;
  --surface-2:#F6F8FB;
  --surface-3:#EAEFF5;
  --line:#D2DAE4;
  --line-strong:#AEBBCA;
  --ink:#16202B;
  --ink-2:#55677A;
  --ink-3:#8493A4;

  --accent:#E85A45;
  --accent-hover:#D14A36;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(232,90,69,.12);
  --accent-line:rgba(232,90,69,.42);

  --t-content:#4E7BA6;
  --t-question:#E85A45;
  --t-ending:#1C8C7D;
  --t-var:#6D4AE0;
  --var-soft:rgba(109,74,224,.11);

  --warn:#B5760F;
  --warn-soft:rgba(181,118,15,.13);
  --danger:#C0392B;
  --danger-soft:rgba(192,57,43,.12);
  --ok:#1C8C7D;

  --wire:#A9B6C6;
  --wire-hot:#E85A45;
  --dot:rgba(22,32,43,.14);

  --shadow-sm:0 1px 2px rgba(16,24,34,.07);
  --shadow-md:0 4px 14px rgba(16,24,34,.10);
  --shadow-lg:0 18px 48px rgba(16,24,34,.20);

  --r-node:6px;
  --r-ctl:5px;

  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10151C;
    --canvas:#0B0F15;
    --surface:#171E27;
    --surface-2:#1D2530;
    --surface-3:#232C38;
    --line:#2A3543;
    --line-strong:#3C4B5D;
    --ink:#E3EAF2;
    --ink-2:#94A4B6;
    --ink-3:#66768A;

    --accent:#FF7A63;
    --accent-hover:#FF9581;
    --accent-ink:#1A0E0B;
    --accent-soft:rgba(255,122,99,.16);
    --accent-line:rgba(255,122,99,.46);

    --t-content:#6FA0CE;
    --t-question:#FF7A63;
    --t-ending:#3BB8A5;
    --t-var:#A98BFF;
    --var-soft:rgba(169,139,255,.15);

    --warn:#E0A040;
    --warn-soft:rgba(224,160,64,.16);
    --danger:#E76A5C;
    --danger-soft:rgba(231,106,92,.16);
    --ok:#3BB8A5;

    --wire:#41505F;
    --wire-hot:#FF7A63;
    --dot:rgba(227,234,242,.10);

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#10151C; --canvas:#0B0F15; --surface:#171E27; --surface-2:#1D2530; --surface-3:#232C38;
  --line:#2A3543; --line-strong:#3C4B5D; --ink:#E3EAF2; --ink-2:#94A4B6; --ink-3:#66768A;
  --accent:#FF7A63; --accent-hover:#FF9581; --accent-ink:#1A0E0B;
  --accent-soft:rgba(255,122,99,.16); --accent-line:rgba(255,122,99,.46);
  --t-content:#6FA0CE; --t-question:#FF7A63; --t-ending:#3BB8A5;
  --t-var:#A98BFF; --var-soft:rgba(169,139,255,.15);
  --warn:#E0A040; --warn-soft:rgba(224,160,64,.16);
  --danger:#E76A5C; --danger-soft:rgba(231,106,92,.16); --ok:#3BB8A5;
  --wire:#41505F; --wire-hot:#FF7A63; --dot:rgba(227,234,242,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 14px rgba(0,0,0,.45); --shadow-lg:0 18px 48px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- shared controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 10px;border:1px solid var(--line-strong);
  background:var(--surface);border-radius:var(--r-ctl);
  font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--surface-3);color:var(--ink)}
.btn-danger{color:var(--danger);border-color:var(--line)}
.btn-danger:hover{background:var(--danger-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-ctl);overflow:hidden}
.seg button{height:28px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ---------- toolbar ---------- */
.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);z-index:6;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:2px}
.brand b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.bar-title{
  min-width:140px;max-width:260px;height:28px;padding:0 8px;
  border:1px solid transparent;border-radius:var(--r-ctl);
  background:transparent;font-weight:600;
}
.bar-title:hover{border-color:var(--line)}
.bar-title:focus{border-color:var(--line-strong);background:var(--surface-2);outline:none}
.bar-sp{flex:1}
.issue-chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:var(--r-ctl);font-family:var(--mono);font-size:11.5px;font-weight:500;
  border:1px solid transparent;cursor:pointer;background:transparent;
}
.issue-chip.clean{color:var(--ok)}
.issue-chip.dirty{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-soft)}
.issue-chip.dirty:hover{border-color:var(--warn)}

/* ---------- edit workspace ---------- */
.work{flex:1;display:flex;min-height:0}
.canvas-wrap{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--canvas);cursor:grab}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.linking{cursor:crosshair}
#world{
  position:absolute;top:0;left:0;width:9000px;height:6500px;transform-origin:0 0;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:26px 26px;
}
#wires{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.75}
#wires path.hot{stroke:var(--wire-hot);stroke-width:2.25}
#wires path.broken{stroke:var(--danger);stroke-dasharray:5 4}

/* ---------- node ---------- */
.node{
  position:absolute;width:252px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-node);
  box-shadow:var(--shadow-sm);user-select:none;
}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-md)}
.node-head{
  display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:grab;
  border-bottom:1px solid var(--line);border-radius:var(--r-node) var(--r-node) 0 0;
}
.node.dragging .node-head{cursor:grabbing}
.node-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--t-content)}
.node[data-type="question"] .node-dot{background:var(--t-question)}
.node[data-type="ending"] .node-dot{background:var(--t-ending)}
.node[data-type="content"] .node-head{background:linear-gradient(var(--surface-2),var(--surface-2))}
.node[data-type="question"] .node-head{background:var(--accent-soft)}
.node[data-type="ending"] .node-head{background:rgba(28,140,125,.10)}
.node-name{
  flex:1;min-width:0;font-size:12.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.node-flag{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px}
.node-flag.start{color:var(--ok);background:rgba(28,140,125,.14)}
.node-flag.warn{color:var(--warn);background:var(--warn-soft)}
.node-flag.err{color:var(--danger);background:var(--danger-soft)}
.node-body{
  padding:8px 9px;font-size:12px;line-height:1.45;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.node-media{display:flex;gap:5px;padding:0 9px 7px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.node-media span{padding:1px 5px;border:1px solid var(--line);border-radius:3px}
.node-choices{border-top:1px solid var(--line)}
.choice-block{border-top:1px solid var(--line)}
.choice-block:first-child{border-top:0}
.choice-row{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:5px 16px 5px 9px;font-size:11.5px;color:var(--ink-2);
}
/* one line, and one port, per effect and per condition — so a cable
   leaves from the thing it belongs to instead of everything sharing
   the choice's single port */
.fx-line{
  position:relative;display:flex;align-items:center;gap:5px;
  padding:3px 16px 3px 22px;font-family:var(--mono);font-size:10px;
  color:var(--t-var);background:var(--var-soft);
}
/* a condition is fed BY a variable, so its port is an inlet on the
   left and the cable arrives from the variable's outlet */
.fx-line.is-cond{padding:3px 9px 3px 20px}
.fx-line.is-cond .port{left:-5px;right:auto}
.node[data-kind="var"] .port.is-src{right:-6px;top:16px;left:auto}
.fx-line+.fx-line{border-top:1px solid var(--surface)}
.fx-line.is-cond{color:var(--warn);background:var(--warn-soft)}
.fx-line .tick{opacity:.55}
.fx-line .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-line .port{width:10px;height:10px;right:-5px}
.port.is-fx{border-color:var(--t-var)}
.port.is-fx:hover,.port.is-fx.armed{background:var(--t-var);border-color:var(--t-var)}
.port.is-cond{border-color:var(--warn)}
.port.is-cond:hover,.port.is-cond.armed{background:var(--warn);border-color:var(--warn)}
.choice-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choice-row .pts{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.port{
  position:absolute;right:-7px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-strong);cursor:crosshair;
}
.port:hover,.port.armed{border-color:var(--accent);background:var(--accent)}
.port.empty{border-color:var(--warn);border-style:dashed}
.node-in{
  position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-strong);
}
.node.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node-add{
  display:block;width:100%;padding:5px;border:0;border-top:1px dashed var(--line);
  background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer;
  border-radius:0 0 var(--r-node) var(--r-node);
}
.node-add:hover{background:var(--surface-2);color:var(--accent)}

/* ---------- canvas overlays ---------- */
.zoom-hud{
  position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:4px;
  padding:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-ctl);box-shadow:var(--shadow-sm);
}
.zoom-hud .z{
  font-family:var(--mono);font-size:11px;color:var(--ink-2);
  min-width:44px;text-align:center;font-variant-numeric:tabular-nums;
}
.zoom-hud button{width:26px;height:24px;border:0;background:transparent;cursor:pointer;border-radius:3px;color:var(--ink-2)}
.zoom-hud button:hover{background:var(--surface-3);color:var(--ink)}
.hint{
  position:absolute;right:12px;bottom:12px;max-width:250px;
  padding:7px 10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-ctl);box-shadow:var(--shadow-sm);
  font-size:11.5px;color:var(--ink-2);
}
.hint b{color:var(--ink);font-weight:600}

/* ---------- inspector ---------- */
.insp{
  flex:0 0 360px;display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-left:1px solid var(--line);
}
.insp-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--line);
}
.insp-head h2{margin:0;font-size:13px;font-weight:600;flex:1}
.insp-id{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.insp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.insp-empty{padding:28px 20px;color:var(--ink-3);font-size:12.5px;text-align:center}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
}
.field .help{font-size:11px;color:var(--ink-3);line-height:1.4}
input[type="text"],input[type="number"],textarea,select{
  width:100%;padding:6px 8px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:var(--r-ctl);
  font-size:12.5px;
}
input[type="text"]:focus,input[type="number"]:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);background:var(--surface);
}
textarea{resize:vertical;min-height:64px}
.rt-tools{display:flex;gap:3px;margin-bottom:-2px}
.rt-tools button{
  width:26px;height:24px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:3px;cursor:pointer;font-size:12px;color:var(--ink-2);
}
.rt-tools button:hover{background:var(--surface-3);color:var(--ink)}
.rt{
  min-height:96px;max-height:280px;overflow-y:auto;padding:8px 9px;
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-ctl);
  font-family:var(--serif);font-size:14px;line-height:1.55;
}
.rt:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.rt p{margin:0 0 .6em}
.rt p:last-child{margin-bottom:0}
.rt ul,.rt ol{margin:0 0 .6em;padding-left:1.2em}

.choice-edit{
  border:1px solid var(--line);border-radius:var(--r-ctl);
  padding:9px;display:flex;flex-direction:column;gap:7px;background:var(--surface-2);
}
.choice-edit .ce-top{display:flex;align-items:center;gap:6px}
.choice-edit .ce-n{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  width:18px;flex:0 0 auto;
}
.ce-grid{display:grid;grid-template-columns:1fr 74px;gap:7px}
.ce-del{
  flex:0 0 auto;width:24px;height:24px;border:1px solid transparent;background:transparent;
  color:var(--ink-3);border-radius:3px;cursor:pointer;
}
.ce-del:hover{color:var(--danger);background:var(--danger-soft)}
.dropzone{
  border:1px dashed var(--line-strong);border-radius:var(--r-ctl);
  padding:12px;text-align:center;font-size:11.5px;color:var(--ink-3);cursor:pointer;
  background:var(--surface-2);
}
.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.thumb{
  margin-top:6px;border:1px solid var(--line);border-radius:var(--r-ctl);
  overflow:hidden;background:var(--surface-3);
}
.thumb img{display:block;width:100%;max-height:140px;object-fit:cover}

/* ---------- issues panel ---------- */
.issues{
  position:absolute;left:12px;top:12px;width:300px;max-height:52%;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-ctl);box-shadow:var(--shadow-md);overflow:hidden;
}
.issues header{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid var(--line);font-size:12px;font-weight:600;
}
.issues header .sp{flex:1}
.issues ul{list-style:none;margin:0;padding:0;overflow-y:auto}
.issues li{
  padding:8px 10px;border-top:1px solid var(--line);font-size:12px;
  cursor:pointer;display:flex;gap:8px;align-items:flex-start;
}
.issues li:first-child{border-top:0}
.issues li:hover{background:var(--surface-2)}
.issues .sev{
  flex:0 0 auto;margin-top:2px;width:7px;height:7px;border-radius:50%;background:var(--warn);
}
.issues li[data-sev="err"] .sev{background:var(--danger)}
.issues .who{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:block}

/* ============================================================
   Player skin
   The learner-facing half owns its OWN token set (--p-*), so
   restyling the delivered scenario to match a Rise course can
   never repaint the builder around it. Each token falls back to
   a builder token, which is what "follow the builder theme"
   means. A generated <style id="skin"> overrides these.
   ============================================================ */
.player,.skin-sample{
  --p-bg:var(--ground);
  --p-surface:var(--surface);
  --p-ink:var(--ink);
  --p-ink-2:var(--ink-2);
  --p-ink-3:var(--ink-3);
  --p-accent:var(--accent);
  --p-accent-ink:var(--accent-ink);
  --p-border:var(--line-strong);
  --p-rule:var(--line);
  --p-radius:var(--r-ctl);
  --p-measure:680px;
  --p-base:17px;
  --p-head:27px;
  --p-head-weight:600;
  --p-font-body:var(--serif);
  --p-font-head:var(--sans);
  --p-tint:color-mix(in srgb,var(--p-accent) 11%,transparent);
}
.player{
  flex:1;min-height:0;overflow-y:auto;background:var(--p-bg);color:var(--p-ink);
  display:flex;flex-direction:column;align-items:center;
}
.player-inner{width:100%;max-width:var(--p-measure);padding:28px 24px 56px}
.prog{
  display:flex;align-items:center;gap:10px;margin-bottom:22px;
  font-family:var(--mono);font-size:11px;color:var(--p-ink-3);
  letter-spacing:.03em;font-variant-numeric:tabular-nums;
}
.prog .track{flex:1;height:2px;background:var(--p-rule);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;background:var(--p-accent);transition:width .3s ease}
.scene-kind{
  display:inline-block;margin-bottom:10px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--p-accent);
}
.scene h1{
  margin:0 0 14px;font-family:var(--p-font-head);
  font-size:var(--p-head);line-height:1.2;font-weight:var(--p-head-weight);
  letter-spacing:-.015em;text-wrap:balance;color:var(--p-ink);
}
.scene-prose{font-family:var(--p-font-body);font-size:var(--p-base);line-height:1.62;color:var(--p-ink)}
.scene-prose p{margin:0 0 .85em}
.scene-prose ul,.scene-prose ol{margin:0 0 .85em;padding-left:1.3em}
.scene-prose a{color:var(--p-accent)}
.scene-media{margin:20px 0}
.scene-media img{display:block;width:100%;border-radius:var(--p-radius);border:1px solid var(--p-rule)}
.scene-media .vid{
  position:relative;padding-top:56.25%;border-radius:var(--p-radius);

/* ============================================================
   Switchback — a self-contained branching scenario builder
   and player. One file: play mode by default, ?edit to author,
   Export writes a fresh copy of this file with your content in.
   ============================================================ */
(function () {
  "use strict";

  /* Captured before anything mutates the DOM. Export rewrites
     this exact markup with a new scenario payload, so the file
     that comes out is another working copy of the file you are
     already using — editor included. */
  var PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;

  var DRAFT_KEY = "switchback:draft:v1";
  var app = document.getElementById("app");

  /* ---------- state ---------- */
  var data = normalise(readBaked());
  var baked = JSON.stringify(data);
  /* An address can force the builder open. It is the only way in when
     the scenario is locked for delivery — and it does NOT survive being
     iframed by a host that owns the outer address, which is exactly the
     claude.ai artifact case, so it can never be the only way in. */
  var urlEdit = /(\?|&)edit\b/.test(location.search) || location.hash === "#edit";
  var mode = urlEdit ? "edit" : "play";
  var restored = false;

  if (mode === "edit") {
    var d = loadDraft();
    if (d) { data = normalise(d); restored = true; }
  }

  var ui = {
    sel: null, pan: { x: 0, y: 0 }, zoom: 1,
    showIssues: false, linking: null, drag: null
  };
  var run = { at: null, path: [], score: 0, lastFeedback: "", vars: {}, deltas: {} };

  /* ---------- data helpers ---------- */
  function readBaked() {
    /* PATCH: when served over http(s), prefer a sibling scenario.json so the
       scenario can be updated without re-exporting this player. Falls back to
       the copy baked in below, so the file still works opened from disk. */
    if (location.protocol === "http:" || location.protocol === "https:") {
      try {
        var x = new XMLHttpRequest();
        x.open("GET", "scenario.json?t=" + Date.now(), false);
        x.send(null);
        if (x.status >= 200 && x.status < 300) {
          var j = JSON.parse(x.responseText);
          if (j && j.scenes && typeof j.scenes === "object") return j;
        }
      } catch (e) { /* fall through to the baked copy */ }
    }
    try { return JSON.parse(document.getElementById("scenario-data").textContent); }
    catch (e) { return { title: "Untitled scenario", theme: "auto", start: null, scenes: {} }; }
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return null;
      var p = JSON.parse(raw);
      return p && p.scenes ? p : null;
    } catch (e) { return null; }
  }
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) { /* private mode */ }
  }
  function uid(prefix) {
    var n = 1, id;
    do { id = prefix + "_" + n++; } while (data.scenes[id]);
    return id;
  }
  function sceneList() { return Object.keys(data.scenes).map(function (k) { return data.scenes[k]; }); }
  function maxScore() {
    return sceneList().reduce(function (t, s) {
      var best = 0;
      (s.choices || []).forEach(function (c) { if ((c.points || 0) > best) best = c.points || 0; });
      return t + best;
    }, 0);
  }

  /* ---------- validation ---------- */
  function validate() {
    var issues = [];
    if (!data.start || !data.scenes[data.start]) {
      issues.push({ sev: "err", who: "scenario", text: "No opening scene is set. Pick one in the inspector." });
    }
    var reach = {}, queue = data.start ? [data.start] : [];
    while (queue.length) {
      var id = queue.shift();
      if (reach[id] || !data.scenes[id]) continue;
      reach[id] = true;
      (data.scenes[id].choices || []).forEach(function (c) {
        var d = resolveTarget(c.target);
        if (d) queue.push(d);
      });
    }
    sceneList().forEach(function (s) {
      var ch = s.choices || [];
      if (s.type !== "ending" && ch.length === 0) {
        issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Dead end — no way out, and it isn't marked as an ending." });
      }
      if (s.type === "ending" && ch.length > 0) {
        issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Marked as an ending but still has choices. They won't be shown." });
      }
      ch.forEach(function (c, i) {
        if (!c.target) {
          issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " (“" + trunc(c.label, 28) + "”) goes nowhere." });
        } else if (!nodeById(c.target)) {
          issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " points at something that no longer exists." });
        } else {
          var dest = resolveTarget(c.target);
          if (!dest) issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " runs into a reroute that leads nowhere." });
          else if (!data.scenes[dest]) issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " ends up somewhere that isn't a scene." });
        }
        if (!c.label || !c.label.trim()) issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " has no label." });
        (c.effects || []).forEach(function (f) {
          if (!f.varId) issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " has an effect wired to nothing -- it does nothing." });
          else if (!varOf(f.varId)) issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " changes a variable that no longer exists, or a merge point that stops short of one." });
        });
        (c.conditions || []).forEach(function (q) {
          if (!q.varId) issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " has a condition wired to nothing -- it is ignored." });
          else if (!varOf(q.varId)) issues.push({ sev: "err", who: s.name || s.id, id: s.id, text: "Choice " + (i + 1) + " is gated on a variable that no longer exists, so it can never appear." });
        });
      });
      if (s.type !== "ending" && ch.length && ch.every(function (c) { return (c.conditions || []).length; })) {
        issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Every choice here is conditional. A learner who meets none of them reaches this scene and cannot leave." });
      }
      ((s.title || "") + " " + (s.body || "")).match(/\{\{\s*\w+\s*\}\}/g) &&
        ((s.title || "") + " " + (s.body || "")).match(/\{\{\s*\w+\s*\}\}/g).forEach(function (m) {
          var k = m.replace(/[{}\s]/g, "");
          if (!varByKey(k)) issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Text uses {{" + k + "}}, which is no variable's key — it will print as written." });
        });
      if (!reach[s.id] && s.id !== data.start) {
        issues.push({ sev: "warn", who: s.name || s.id, id: s.id, text: "Unreachable — nothing links to it." });
      }
    });

    /* Loops are legitimate — sending a learner back to an earlier
       scene is a real teaching move, and the player handles it. What
       is NOT legitimate is a loop with no way out. Walk backwards
       from every ending; any scene the learner can reach that isn't
       in that set is a trap, however many choices it offers. */
    var canEnd = {}, inbound = {};
    sceneList().forEach(function (s) {
      (s.choices || []).forEach(function (c) {
        var d = resolveTarget(c.target);
        if (d) (inbound[d] = inbound[d] || []).push(s.id);
      });
    });
    var q2 = sceneList().filter(function (s) { return s.type === "ending"; })
      .map(function (s) { return s.id; });
    while (q2.length) {
      var e2 = q2.shift();
      if (canEnd[e2]) continue;
      canEnd[e2] = true;
      (inbound[e2] || []).forEach(function (p) { if (!canEnd[p]) q2.push(p); });
    }
    sceneList().forEach(function (s) {
      if (reach[s.id] && !canEnd[s.id] && s.type !== "ending" && (s.choices || []).length) {
        issues.push({ sev: "err", who: s.name || s.id, id: s.id,
          text: "No ending can be reached from here. A learner who arrives is going round a loop with no way out." });
      }
    });

    rerouteList().forEach(function (r) {
      if (!r.target) {
        issues.push({ sev: "err", who: "reroute", id: r.id, text: "This reroute doesn't lead anywhere, so every choice through it is a dead end." });
      } else if (!resolveTarget(r.id)) {
        issues.push({ sev: "err", who: "reroute", id: r.id, text: "Reroutes pointing at each other in a ring — nothing can get through." });
      }
    });

    var keys = {};
    varList().forEach(function (v) {
      var who = v.label || v.key || v.id;
      if (!v.key) issues.push({ sev: "err", who: who, id: v.id, text: "No key, so no text or condition can refer to it." });
      else if (keys[v.key]) issues.push({ sev: "err", who: who, id: v.id, text: "Another variable already uses the key “" + v.key + "”." });
      keys[v.key] = 1;
      if (v.min !== "" && v.max !== "" && v.min != null && v.max != null && Number(v.min) > Number(v.max)) {
        issues.push({ sev: "err", who: who, id: v.id, text: "Minimum is above maximum, so it can never hold a value." });
      }
      var touched = sceneList().some(function (s) {
        return (s.choices || []).some(function (c) {
          return (c.effects || []).some(function (f) { return f.varId === v.id; });
        });
      });
      if (!touched) issues.push({ sev: "warn", who: who, id: v.id, text: "Nothing ever changes this. It stays at " + (v.start || 0) + " for every learner." });
    });
    return issues;
  }
  function issuesFor(id) {

  /* ---------- small utils ---------- */
  function el(tag, cls, txt) {

  /* offsetLeft/offsetTop are measured from the nearest POSITIONED

    var x = 0, y = 0, n = node;

  /* Variables live in their own map. They share the canvas with scenes
     but are NOT part of the navigation graph, so keeping them out of
     data.scenes keeps every routing, reachability and dead-end check
     honest without a type guard in each one. */
  function varList() { return Object.keys(data.vars || {}).map(function (k) { return data.vars[k]; }); }
  function rerouteList() { return Object.keys(data.reroutes || {}).map(function (k) { return data.reroutes[k]; }); }
  function nodeById(id) {
    return (data.scenes && data.scenes[id]) ||

           (data.reroutes && data.reroutes[id]) || null;
  }
  function isVar(id) { return !!(data.vars && data.vars[id]); }
  function isReroute(id) { return !!(data.reroutes && data.reroutes[id]); }

  /* A reroute is a bend in the cable, not a step in the story. Follow

     rather than spinning, so a mistake in the graph cannot hang the
     player. */
  function resolveTarget(id) {
    var seen = {}, cur = id;
    while (cur && isReroute(cur)) {

  /* An effect names either a variable or a reroute that eventually

  function indexOfChoice(s, c) {

  }
  /* The smallest scenario that is actually valid: somewhere to start,

     board, which is a rotten thing to hand someone on a blank page. */
  function blankScenario() {
    return {
      formatVersion: 1,
      title: "Untitled scenario",
      theme: "auto",
      start: "s_1",
      scenes: {
        s_1: {
          id: "s_1", type: "content", name: "Opening",
          title: "", body: "", image: "", video: "",
          x: 240, y: 220,
          choices: [{ id: "c1", label: "Continue", target: "end_1", points: 0, feedback: "", effects: [], conditions: [] }]
        },
        end_1: {
          id: "end_1", type: "ending", name: "Ending",
          title: "", body: "", image: "", video: "",
          x: 640, y: 220,
          choices: []
        }
      },
      vars: {}, reroutes: {}, style: {}, customCss: ""
    };
  }

  function normalise(d) {
    d.formatVersion = 1;
    d.scenes = d.scenes || {};
    d.vars = d.vars || {};
    d.reroutes = d.reroutes || {};
    d.style = d.style || {};
    /* effects and conditions each own a port now, so each needs a
       stable id. Older files have none — give them one. */
    Object.keys(d.scenes).forEach(function (k) {
      (d.scenes[k].choices || []).forEach(function (c) {
        (c.effects || []).forEach(function (f, i) { if (!f.id) f.id = "f" + (i + 1); });

      Array.prototype.slice.call(node.children).forEach(function (c) {
        walk(c);

    return null;
  }

  /* ============================================================

     ============================================================ */
  var SKIN_KEYS = ["bg", "surface", "ink", "ink-2", "ink-3", "accent", "accent-ink", "border", "rule"];
  var SKIN_SWATCHES = [
    ["bg", "Page background"], ["surface", "Card / choice fill"],
    ["ink", "Body text"], ["ink-2", "Secondary text"], ["ink-3", "Faint text"],
    ["accent", "Accent"], ["accent-ink", "Text on accent"],
    ["border", "Control border"], ["rule", "Hairlines"]
  ];
  var PRESETS = {
    riseLight: { label: "Rise light", vals: {
      bg: "#FFFFFF", surface: "#F7F8F9", ink: "#2C3E50", "ink-2": "#5F6F7E", "ink-3": "#8A98A5",
      accent: "#0B7FAB", "accent-ink": "#FFFFFF", border: "#C4CED6", rule: "#E3E8EC" } },
    riseDark: { label: "Rise dark", vals: {
      bg: "#1B2027", surface: "#232B34", ink: "#E8EDF2", "ink-2": "#A3B0BD", "ink-3": "#7B8794",
      accent: "#4BB3D8", "accent-ink": "#0C1116", border: "#3A4550", rule: "#2C353F" } },
    paper: { label: "Warm paper", vals: {
      bg: "#FBF7F1", surface: "#FFFFFF", ink: "#2A241D", "ink-2": "#6B5F52", "ink-3": "#968A7C",
      accent: "#B4552D", "accent-ink": "#FFFFFF", border: "#D6C9B9", rule: "#EBE2D7" } },
    ink: { label: "High contrast", vals: {
      bg: "#FFFFFF", surface: "#FFFFFF", ink: "#000000", "ink-2": "#3A3A3A", "ink-3": "#5C5C5C",
      accent: "#00507A", "accent-ink": "#FFFFFF", border: "#000000", rule: "#9A9A9A" } }
  };
  var FONT_OPTIONS = [
    ["", "Follow the builder"],
    ["var(--sans)", "IBM Plex Sans"],
    ["var(--serif)", "Source Serif"],
    ["var(--mono)", "IBM Plex Mono"],
    ["system-ui,-apple-system,'Segoe UI',sans-serif", "System sans"],
    ["Georgia,'Times New Roman',serif", "System serif"]

  /* ============================================================

     ============================================================ */
  var lastRenderSel = null;

    var prev = document.querySelector(".insp-body");
    var prevTop = prev ? prev.scrollTop : 0;

    applySkin();

    app.appendChild(buildBar());
    if (restored) app.appendChild(buildBanner());
    if (mode === "edit") app.appendChild(buildWorkspace());
    else app.appendChild(buildPlayer());

  /* ---------- toolbar ---------- */

  /* ============================================================
     EDIT MODE

    varList().forEach(function (v) { world.appendChild(buildVarNode(v)); });
    rerouteList().forEach(function (r) { world.appendChild(buildRerouteNode(r)); });
    wrap.appendChild(world);
    wrap.appendChild(buildZoomHud());
    wrap.appendChild(buildHint());

    work.appendChild(wrap);
    work.appendChild(buildInspector());

    requestAnimationFrame(function () { applyTransform(); drawWires(); });

  }

  function buildZoomHud() {
    var h = el("div", "zoom-hud");
    var out = el("button", null, "−"); out.title = "Zoom out"; out.setAttribute("aria-label", "Zoom out");
    var lvl = el("div", "z", Math.round(ui.zoom * 100) + "%");
    var inn = el("button", null, "+"); inn.title = "Zoom in"; inn.setAttribute("aria-label", "Zoom in");
    var fit = el("button", null, "⤢"); fit.title = "Fit all scenes"; fit.setAttribute("aria-label", "Fit all scenes");

  function buildHint() {

      "<b>Drag a port</b> onto a scene to connect, onto a variable to change it, " +
      "or onto empty canvas to make a scene there. <b>Shift-drop</b> on empty canvas " +
      "drops a reroute instead. Back on its own scene disconnects.";
    var legend = el("div", "kbd-legend");
    [["Del", "remove selected"], ["N", "scene"], ["V", "variable"], ["R", "reroute"], ["F", "fit"], ["Esc", "deselect"]]
      .forEach(function (k) {
        var w = el("span");
        w.innerHTML = "<kbd>" + k[0] + "</kbd> " + k[1];
        legend.appendChild(w);
      });
    h.appendChild(legend);
    return h;
  }
  function buildIssues() {
    var box = el("div", "issues");
    var head = el("header");
    head.appendChild(el("span", null, "Checks"));
    head.appendChild(el("div", "sp"));
    var x = el("button", "btn btn-quiet", "Close");
    x.addEventListener("click", function () { ui.showIssues = false; render(); });
    head.appendChild(x);
    box.appendChild(head);
    var list = el("ul");
    var issues = validate();
    if (!issues.length) {
      var ok = el("li"); ok.appendChild(el("span", "sev")); ok.appendChild(el("span", null, "Everything links up. No dead ends, no orphans."));
      ok.style.cursor = "default"; list.appendChild(ok);
    }
    issues.forEach(function (i) {
      var li = el("li"); li.setAttribute("data-sev", i.sev);
      li.appendChild(el("span", "sev"));
      var body = el("div");
      body.appendChild(el("span", "who", i.who));
      body.appendChild(document.createTextNode(i.text));
      li.appendChild(body);
      if (i.id) li.addEventListener("click", function () { ui.sel = i.id; centreOn(i.id); render(); });
      list.appendChild(li);
    });
    box.appendChild(list);
    return box;
  }

  /* ---------- node ---------- */
  function buildNode(s) {
    var n = el("div", "node" + (ui.sel === s.id ? " sel" : ""));
    n.dataset.id = s.id;
    n.dataset.type = s.type;
    n.style.left = (s.x || 0) + "px";
    n.style.top = (s.y || 0) + "px";

    n.appendChild(el("div", "node-in"));

    var head = el("div", "node-head");
    head.appendChild(el("span", "node-dot"));
    head.appendChild(el("span", "node-name", s.name || s.title || s.id));
    if (data.start === s.id) head.appendChild(el("span", "node-flag start", "START"));
    var mine = issuesFor(s.id);
    if (mine.length) {
      var worst = mine.some(function (i) { return i.sev === "err"; }) ? "err" : "warn";
      var f = el("span", "node-flag " + worst, mine.length + "");
      f.title = mine.map(function (i) { return i.text; }).join("\n");
      head.appendChild(f);
    }
    n.appendChild(head);

    var preview = stripHtml(s.body) || "No text yet.";
    n.appendChild(el("div", "node-body", preview));

    if (s.image || s.video) {
      var m = el("div", "node-media");
      if (s.image) m.appendChild(el("span", null, "IMG"));
      if (s.video) m.appendChild(el("span", null, "VIDEO"));
      n.appendChild(m);
    }

    if (s.type !== "ending") {
      var wrapC = el("div", "node-choices");
      (s.choices || []).forEach(function (c) {
        var blk = el("div", "choice-block");

        var row = el("div", "choice-row");
        row.appendChild(el("span", "lbl", c.label || "Untitled choice"));
        if (c.points) row.appendChild(el("span", "pts", (c.points > 0 ? "+" : "") + c.points));
        row.appendChild(makePort(s.id, c.id, c.target, "", portTitle(c.target)));
        blk.appendChild(row);

        (c.conditions || []).forEach(function (q) {
          var v = varOf(q.varId);
          var line = el("div", "fx-line is-cond");
          line.appendChild(makePort(s.id, c.id + "|if|" + q.id, q.varId, " is-cond",
            v ? "Fed by " + v.key + " — drag to a different variable, or drag a variable's outlet here"
              : "Nothing feeds this yet — drag a variable's outlet onto it"));
          line.appendChild(el("span", "tick", "if"));
          line.appendChild(el("span", "nm", (v ? v.key : "—") + " " + (q.cmp || ">=") + " " + (q.value == null ? 0 : q.value)));
          blk.appendChild(line);
        });

        (c.effects || []).forEach(function (fx) {
          var v = varOf(fx.varId);
          var line = el("div", "fx-line");
          line.appendChild(el("span", "tick", OP_SIGN[fx.op || "add"]));
          line.appendChild(el("span", "nm", (fx.amount == null ? 1 : fx.amount) + " " + (v ? v.key : "—")));
          line.appendChild(makePort(s.id, c.id + "|fx|" + fx.id, fx.varId, " is-fx",
            v ? v.key + " " + OP_WORD[fx.op || "add"] + " " + fx.amount
              : "Not pointed at a variable yet — drag me onto one"));
          blk.appendChild(line);
        });

        wrapC.appendChild(blk);
      });
      n.appendChild(wrapC);
      var add = el("button", "node-add", "+ choice");
      add.addEventListener("click", function (e) { e.stopPropagation(); addChoice(s.id); });
      n.appendChild(add);
    }
    return n;
  }

  /* Every port carries the node it belongs to and a slot key unique
     within that node. The slot says what a drag from it MEANS, so
     nothing has to be inferred from where it lands:
       "c1"          the choice's destination
       "c1|fx|f2"    that choice's second effect
       "c1|if|q1"    that choice's first condition
       "__out"       a reroute's onward cable                        */
  function makePort(nodeId, slot, bound, extraClass, title) {
    var p = el("span", "port" + (bound ? "" : " empty") + (extraClass || ""));
    p.dataset.node = nodeId;
    p.dataset.slot = slot;
    if (title) p.title = title;
    return p;
  }
  function parseSlot(slot) {
    if (slot === "__out") return { kind: "out" };
    if (slot === "__src") return { kind: "src" };
    var parts = String(slot).split("|");
    if (parts.length === 1) return { kind: "target", choice: parts[0] };
    return { kind: parts[1] === "fx" ? "fx" : "cond", choice: parts[0], id: parts[2] };
  }
  /* Given a node and a slot, hand back the thing the slot edits. */
  function slotRef(nodeId, slot) {
    var info = parseSlot(slot);
    if (info.kind === "out") {
      var r = data.reroutes[nodeId];
      return r ? { kind: "out", get: function () { return r.target; }, set: function (v) { r.target = v; } } : null;
    }
    var sc = data.scenes[nodeId];
    var c = sc ? (sc.choices || []).filter(function (x) { return x.id === info.choice; })[0] : null;
    if (!c) return null;
    if (info.kind === "target") {
      return { kind: "target", choice: c, get: function () { return c.target; }, set: function (v) { c.target = v; } };
    }
    var list = info.kind === "fx" ? (c.effects || []) : (c.conditions || []);
    var item = list.filter(function (x) { return x.id === info.id; })[0];
    if (!item) return null;
    return {
      kind: info.kind, choice: c, item: item,
      get: function () { return item.varId; },
      set: function (v) { item.varId = v; }
    };
  }

  function nodeLabel(id) {
    var n = nodeById(id);
    if (!n) return null;
    if (isReroute(id)) return "a reroute";
    return n.name || n.label || n.key || id;
  }
  function portTitle(target) {
    if (!target) return "Not connected — drag me onto a scene, a variable, or empty canvas";
    var n = nodeById(target);
    if (!n) return "Points at something that no longer exists";
    if (isReroute(target)) {
      var end = resolveTarget(target);
      return end && nodeById(end)
        ? "Goes to " + nodeLabel(end) + ", via a reroute"
        : "Goes into a reroute that leads nowhere";
    }
    return "Goes to " + nodeLabel(target);
  }

  function buildRerouteNode(r) {
    var n = el("div", "node" + (ui.sel === r.id ? " sel" : ""));
    n.dataset.id = r.id;
    n.dataset.kind = "reroute";
    n.style.left = (r.x || 0) + "px";
    n.style.top = (r.y || 0) + "px";

    var dot = el("div", "node-head");
    dot.title = "Reroute — drag to move, drag its nub to re-aim";
    n.appendChild(dot);

    n.appendChild(makePort(r.id, "__out", r.target,
      isVarRoute(r.id) ? " is-fx" : "", portTitle(r.target)));

    var mine = issuesFor(r.id);
    if (mine.length) {
      var f = el("span", "node-flag err", String(mine.length));
      f.title = mine.map(function (i) { return i.text; }).join("\n");
      n.appendChild(f);
    }
    return n;
  }

  var OP_SIGN = { add: "+", sub: "−", set: "=", mul: "×", div: "÷" };
  var OP_WORD = { add: "goes up by", sub: "goes down by", set: "is set to", mul: "is multiplied by", div: "is divided by" };
  var CMPS = [">", ">=", "<", "<=", "==", "!="];

  function buildVarNode(v) {
    var n = el("div", "node" + (ui.sel === v.id ? " sel" : ""));
    n.dataset.id = v.id;
    n.dataset.kind = "var";
    n.style.left = (v.x || 0) + "px";
    n.style.top = (v.y || 0) + "px";
    n.appendChild(el("div", "node-in"));
    /* the outlet a condition is fed from */
    n.appendChild(makePort(v.id, "__src", true, " is-src",
      "Drag onto a condition to feed it"));

    var head = el("div", "node-head");
    head.appendChild(el("span", "node-dot var"));
    head.appendChild(el("span", "node-name", v.label || v.key));
    var mine = issuesFor(v.id);
    if (mine.length) {
      var f = el("span", "node-flag err", String(mine.length));
      f.title = mine.map(function (i) { return i.text; }).join("\n");
      head.appendChild(f);
    }
    n.appendChild(head);

    var b = el("div", "var-body");
    b.appendChild(el("span", "k", v.key));
    b.appendChild(el("span", "v", fmtVar(v, v.start)));
    n.appendChild(b);

    var foot = el("div", "var-foot");
    if (v.min !== "" && v.min != null) foot.appendChild(el("span", null, "min " + v.min));
    if (v.max !== "" && v.max != null) foot.appendChild(el("span", null, "max " + v.max));
    if (v.show) foot.appendChild(el("span", null, "shown"));
    var uses = 0;
    sceneList().forEach(function (s) {
      (s.choices || []).forEach(function (c) {
        uses += (c.effects || []).filter(function (x) { return resolveTarget(x.varId) === v.id; }).length;
      });
    });
    if (uses) foot.appendChild(el("span", null, uses + (uses === 1 ? " effect" : " effects")));
    if (foot.children.length) n.appendChild(foot);
    return n;
  }

  /* ---------- wires ---------- */
  function portPos(nodeId, slot) {
    var world = document.getElementById("world");
    var s = nodeById(nodeId);
    if (!world || !s) return null;
    var node = world.querySelector('.node[data-id="' + nodeId + '"]');
    var port = world.querySelector('.port[data-node="' + nodeId + '"][data-slot="' + slot + '"]');
    if (!node || !port) return null;
    var o = offsetIn(port, node);
    return { x: (s.x || 0) + o.x + port.offsetWidth / 2, y: (s.y || 0) + o.y + port.offsetHeight / 2 };
  }
  function inletPos(id) {
    var n = nodeById(id);
    if (!n) return null;
    if (isReroute(id)) return { x: (n.x || 0) + 8, y: (n.y || 0) + 8 };
    return { x: (n.x || 0) - 6, y: (n.y || 0) + 21 };
  }
  function outletPos(id) {
    var n = nodeById(id);
    if (!n) return null;
    var world = document.getElementById("world");
    var e2 = world && world.querySelector('.node[data-id="' + id + '"]');
    return { x: (n.x || 0) + (e2 ? e2.offsetWidth : 214) + 6, y: (n.y || 0) + 21 };
  }

  function drawWires() {
    var svg = document.getElementById("wires");
    if (!svg) return;
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    sceneList().forEach(function (s) {
      (s.choices || []).forEach(function (c) {
        /* the choice's own port carries only the destination */
        var p1 = portPos(s.id, c.id);
        if (p1 && c.target) {
          var hot = ui.sel === s.id || ui.sel === c.target;
          var to = nodeById(c.target);
          if (!to) {
            svg.appendChild(wirePath(p1.x, p1.y, p1.x + 70, p1.y, "broken"));
          } else {
            var i = inletPos(c.target);
            svg.appendChild(hitWire(p1.x, p1.y, i.x, i.y, s.id, c.id));
            svg.appendChild(wirePath(p1.x, p1.y, i.x, i.y, hot ? "hot" : ""));
          }
        }
        /* every condition and every effect leaves from its own port,
           so which cable belongs to which is never a guess */
        (c.conditions || []).forEach(function (q) {
          /* drawn variable → condition, the way the value actually
             travels. No bend points on these: a condition is one
             source feeding one test, so there is nothing to merge. */
          var v = varOf(q.varId);
          if (!v) return;
          var pc = portPos(s.id, c.id + "|if|" + q.id);
          var pv = portPos(v.id, "__src");
          if (pc && pv) svg.appendChild(wirePath(pv.x, pv.y, pc.x, pc.y, "reads"));
        });
        (c.effects || []).forEach(function (fx) {
          var slot = c.id + "|fx|" + fx.id;
          var pf = portPos(s.id, slot);
          if (!pf || !fx.varId || !nodeById(fx.varId)) return;
          /* drawn to the next hop, not the final variable, so a merge
             point shows as one cable onward instead of three */
          var iv = inletPos(fx.varId);
          if (!iv) return;
          svg.appendChild(hitWire(pf.x, pf.y, iv.x, iv.y, s.id, slot));
          svg.appendChild(wirePath(pf.x, pf.y, iv.x, iv.y, "effect"));
        });
      });
    });

    rerouteList().forEach(function (r) {
      var p1 = portPos(r.id, "__out");
      if (!p1) return;
      if (!r.target || !nodeById(r.target)) {
        svg.appendChild(wirePath(p1.x, p1.y, p1.x + 50, p1.y, "broken"));
        return;
      }
      var i = inletPos(r.target);
      if (i) {
        /* a reroute is typed by where it ends up: a cable heading for
           a variable stays violet and dashed the whole way */
        var carriesEffect = isVarRoute(r.id);
        svg.appendChild(hitWire(p1.x, p1.y, i.x, i.y, r.id, "__out"));
        svg.appendChild(wirePath(p1.x, p1.y, i.x, i.y,
          carriesEffect ? "effect" : (ui.sel === r.id ? "hot" : "")));
      }
    });

    if (ui.linking && ui.linking.cur) {
      var k = ui.linking.kind;
      svg.appendChild(wirePath(ui.linking.x, ui.linking.y, ui.linking.cur.x, ui.linking.cur.y,
        k === "fx" ? "effect" : (k === "cond" || k === "src") ? "reads" : "hot"));
    }
  }
  function hitWire(x1, y1, x2, y2, fromId, slot) {
    var p = wirePath(x1, y1, x2, y2, "hit");
    p.setAttribute("data-from", fromId);
    p.setAttribute("data-slot", slot);
    var kind = parseSlot(slot).kind;
    var t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = (kind === "fx" || kind === "cond")
      ? "Click to add a merge point — other cables can join here"
      : "Click to bend this wire here";
    p.appendChild(t);
    return p;
  }
  /* Drop a reroute into the middle of an existing connection: the new
     bend inherits where the wire was going, and the wire now goes to
     the bend. Nothing downstream notices. */
  /* One shape for every cable now: whatever the slot points at, the
     new bend inherits it and the slot points at the bend. */
  function spliceReroute(fromId, slot, pt) {
    var ref = slotRef(fromId, slot);
    if (!ref) return null;
    var rid = addReroute({ x: pt.x - 8, y: pt.y - 8 });
    data.reroutes[rid].target = ref.get();
    ref.set(rid);
    saveDraft();
    return rid;
  }
  function wirePath(x1, y1, x2, y2, cls) {
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    var dx = Math.max(34, Math.min(130, Math.abs(x2 - x1) * 0.55));
    p.setAttribute("d", "M " + x1 + " " + y1 + " C " + (x1 + dx) + " " + y1 + ", " + (x2 - dx) + " " + y2 + ", " + x2 + " " + y2);
    if (cls) p.setAttribute("class", cls.trim());
    return p;
  }

  /* ---------- canvas interaction ---------- */
  function applyTransform() {
    var world = document.getElementById("world");
    if (!world) return;
    world.style.transform = "translate(" + ui.pan.x + "px," + ui.pan.y + "px) scale(" + ui.zoom + ")";
    var z = document.querySelector(".zoom-hud .z");
    if (z) z.textContent = Math.round(ui.zoom * 100) + "%";
  }
  function zoomBy(f, cx, cy) {
    var wrap = document.getElementById("canvasWrap");
    if (!wrap) return;
    var r = wrap.getBoundingClientRect();
    cx = cx == null ? r.width / 2 : cx;
    cy = cy == null ? r.height / 2 : cy;
    var next = Math.max(0.25, Math.min(2, ui.zoom * f));
    var k = next / ui.zoom;
    ui.pan.x = cx - (cx - ui.pan.x) * k;
    ui.pan.y = cy - (cy - ui.pan.y) * k;
    ui.zoom = next;
    applyTransform();
  }
  function fitView() {
    var list = allNodes();
    if (!list.length) return;
    var wrap = document.getElementById("canvasWrap");
    var r = wrap.getBoundingClientRect();
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    list.forEach(function (s) {
      var node = document.querySelector('.node[data-id="' + s.id + '"]');
      var h = node ? node.offsetHeight : 130;
      minX = Math.min(minX, s.x || 0); minY = Math.min(minY, s.y || 0);
      maxX = Math.max(maxX, (s.x || 0) + 252); maxY = Math.max(maxY, (s.y || 0) + h);
    });
    var pad = 60;
    var z = Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY), 1.4);
    ui.zoom = Math.max(0.25, Math.min(2, z));
    ui.pan.x = pad - minX * ui.zoom + (r.width - pad * 2 - (maxX - minX) * ui.zoom) / 2;
    ui.pan.y = pad - minY * ui.zoom + (r.height - pad * 2 - (maxY - minY) * ui.zoom) / 2;
    applyTransform();
  }
  function centreOn(id) {
    var s = data.scenes[id];
    if (!s) return;
    var wrap = document.getElementById("canvasWrap");
    if (!wrap) return;
    var r = wrap.getBoundingClientRect();
    ui.pan.x = r.width / 2 - ((s.x || 0) + 126) * ui.zoom;
    ui.pan.y = r.height / 2 - ((s.y || 0) + 60) * ui.zoom;
  }
  function toWorld(e, wrap) {
    var r = wrap.getBoundingClientRect();
    return {
      x: (e.clientX - r.left - ui.pan.x) / ui.zoom,
      y: (e.clientY - r.top - ui.pan.y) / ui.zoom
    };
  }

  function wireCanvas(wrap, world) {
    wrap.addEventListener("wheel", function (e) {
      e.preventDefault();
      var r = wrap.getBoundingClientRect();
      zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    wrap.addEventListener("pointerdown", function (e) {
      /* a fat invisible stroke sitting on a routing wire */
      var wire = e.target && e.target.getAttribute && e.target.getAttribute("data-from")
        ? e.target : null;
      if (wire) {
        e.preventDefault();
        var at = toWorld(e, wrap);
        var rid = spliceReroute(wire.getAttribute("data-from"), wire.getAttribute("data-slot"), at);
        if (!rid) return;
        ui.sel = rid;
        /* insert the node directly rather than re-rendering, so this
           same gesture can carry straight on into dragging it */
        world.appendChild(buildRerouteNode(data.reroutes[rid]));
        var fresh = world.querySelector('.node[data-id="' + rid + '"]');
        if (fresh) fresh.classList.add("dragging");
        ui.drag = { id: rid, dx: 8, dy: 8 };
        wrap.setPointerCapture(e.pointerId);
        refreshSelection();
        return;
      }

      var port = e.target.closest(".port");
      var node = e.target.closest(".node");
      var head = e.target.closest(".node-head");

      if (port) {
        e.preventDefault(); e.stopPropagation();
        var p = portPos(port.dataset.node, port.dataset.slot);
        if (!p) return;
        ui.linking = {
          from: port.dataset.node, slot: port.dataset.slot,
          kind: parseSlot(port.dataset.slot).kind,
          x: p.x, y: p.y, cur: toWorld(e, wrap), overVar: false
        };
        port.classList.add("armed");
        wrap.classList.add("linking");
        wrap.setPointerCapture(e.pointerId);
        drawWires();
        return;
      }

      if (node && head) {
        e.preventDefault();
        ui.sel = node.dataset.id;
        var sc = nodeById(ui.sel);
        var p0 = toWorld(e, wrap);
        ui.drag = { id: ui.sel, dx: p0.x - (sc.x || 0), dy: p0.y - (sc.y || 0) };
        node.classList.add("dragging");
        wrap.setPointerCapture(e.pointerId);
        refreshSelection();
        return;
      }

      if (node) { ui.sel = node.dataset.id; refreshSelection(); return; }

      ui.sel = null;
      refreshSelection();
      ui.panning = { x: e.clientX - ui.pan.x, y: e.clientY - ui.pan.y };
      wrap.classList.add("panning");
      wrap.setPointerCapture(e.pointerId);
    });

    wrap.addEventListener("pointermove", function (e) {
      if (ui.linking) {
        ui.linking.cur = toWorld(e, wrap);
        var over = nodeAtPoint(e);
        ui.linking.overVar = !!(over && isVar(over.dataset.id));
        world.querySelectorAll(".node.drop-target").forEach(function (n) { n.classList.remove("drop-target"); });
        if (over && over.dataset.id !== ui.linking.from) over.classList.add("drop-target");
        drawWires();
        return;
      }
      if (ui.drag) {
        var p = toWorld(e, wrap);
        var s = nodeById(ui.drag.id);
        s.x = Math.round(p.x - ui.drag.dx);
        s.y = Math.round(p.y - ui.drag.dy);
        var n = world.querySelector('.node[data-id="' + s.id + '"]');
        n.style.left = s.x + "px"; n.style.top = s.y + "px";
        drawWires();
        return;
      }
      if (ui.panning) {
        ui.pan.x = e.clientX - ui.panning.x;
        ui.pan.y = e.clientY - ui.panning.y;
        applyTransform();
      }
    });

    function endPointer(e) {
      if (ui.linking) {
        var over = nodeAtPoint(e);
        var overId = over ? over.dataset.id : null;

        /* dragging OUT of a variable: the only sensible landing is a
           condition's inlet, so hit-test the port, not the node */
        if (ui.linking.kind === "src") {
          var landed = portAtPoint(e);
          if (landed && parseSlot(landed.dataset.slot).kind === "cond") {
            var tref = slotRef(landed.dataset.node, landed.dataset.slot);
            if (tref) { tref.set(ui.linking.from); ui.sel = landed.dataset.node; }
          } else if (overId && data.scenes[overId]) {
            toast("Drop it on a condition's port — the small one on the left of a choice.");
          }
          ui.linking = null;
          wrap.classList.remove("linking");
          world.querySelectorAll(".node.drop-target").forEach(function (n) { n.classList.remove("drop-target"); });
          saveDraft(); render();
          return;
        }

        var ref = slotRef(ui.linking.from, ui.linking.slot);
        /* an effect or a condition cable must reach a variable; a
           destination cable must reach a scene. A reroute is allowed
           either way — it takes its meaning from its own far end. */
        var wantsVar = ui.linking.kind === "fx" || ui.linking.kind === "cond";

        if (ref) {
          if (overId === ui.linking.from) {
            ref.set(null);                                    /* back on itself — disconnect */
          } else if (overId) {
            var isR = isReroute(overId);
            if (wantsVar ? (isVar(overId) || isR) : (!!data.scenes[overId] || isR)) {
              ref.set(overId);
            } else {
              toast(wantsVar
                ? "An effect has to reach a variable, not a scene."
                : "A destination has to be a scene, not a variable.");
            }
          } else if (e.shiftKey && ui.linking.kind !== "cond") {
            var rid = addReroute({ x: ui.linking.cur.x - 8, y: ui.linking.cur.y - 8 });
            ref.set(rid);                                     /* shift — bend the cable here */
            ui.sel = rid;
          } else if (wantsVar) {
            var vid = addVariable(                            /* onto nothing — make a variable */
              { x: ui.linking.cur.x + 10, y: ui.linking.cur.y - 20 }, true);
            ref.set(vid);
            ui.sel = vid;
          } else {
            var nid = addScene("content",                     /* onto nothing — make a scene */
              { x: ui.linking.cur.x + 10, y: ui.linking.cur.y - 20 }, true);
            ref.set(nid);
            ui.sel = nid;
          }
        }
        ui.linking = null;
        wrap.classList.remove("linking");
        world.querySelectorAll(".node.drop-target").forEach(function (n) { n.classList.remove("drop-target"); });
        saveDraft();
        render();
        return;
      }
      if (ui.drag) {
        var n = world.querySelector('.node[data-id="' + ui.drag.id + '"]');
        if (n) n.classList.remove("dragging");
        ui.drag = null;
        saveDraft();
        return;
      }
      if (ui.panning) { ui.panning = null; wrap.classList.remove("panning"); }
    }
    wrap.addEventListener("pointerup", endPointer);
    wrap.addEventListener("pointercancel", endPointer);
  }

  function refreshSelection() {

  /* ---------- graph edits ---------- */
  function centreOfView(offX, offY) {
    var wrap = document.getElementById("canvasWrap");
    if (!wrap) return { x: 400, y: 400 };
    var r = wrap.getBoundingClientRect();
    return {
      x: (r.width / 2 - ui.pan.x) / ui.zoom - (offX || 0),
      y: (r.height / 2 - ui.pan.y) / ui.zoom - (offY || 0)
    };
  }
  function addScene(type, at, quiet) {
    var pos = at || centreOfView(126, 60);
    var id = uid(type === "ending" ? "end" : type === "question" ? "q" : "s");
    data.scenes[id] = {
      id: id, type: type || "content", name: "New scene",
      title: "", body: "", image: "", video: "",
      x: Math.round(pos.x), y: Math.round(pos.y),
      choices: type === "ending" ? [] : [{ id: "c1", label: "Continue", target: null, points: 0, feedback: "" }]
    };
    if (!data.start) data.start = id;
    if (!quiet) { ui.sel = id; saveDraft(); render(); }
    return id;
  }
  function addVariable(at, quiet) {
    var pos = at || centreOfView(107, -160);
    var n = 1;
    while (data.vars["var_" + n]) n++;
    var id = "var_" + n;
    var k = 1, key = "value1";
    while (varByKey(key)) { k++; key = "value" + k; }
    data.vars[id] = {
      id: id, key: key, label: "New variable",
      start: 0, min: "", max: "", decimals: 0, show: true,
      x: Math.round(pos.x), y: Math.round(pos.y)
    };
    if (!quiet) { ui.sel = id; saveDraft(); render(); }
    return id;
  }
  function addReroute(at) {
    var pos = at || centreOfView(8, 8);
    var n = 1;
    while (data.reroutes["r_" + n]) n++;
    var id = "r_" + n;
    data.reroutes[id] = { id: id, x: Math.round(pos.x), y: Math.round(pos.y), target: null };
    return id;
  }
  function nextItemId(list, prefix) {
    var n = 1;
    while (list.some(function (x) { return x.id === prefix + n; })) n++;
    return prefix + n;
  }
  /* No de-duplication. Two effects on one choice pointing at the same
     variable is a mistake you can SEE — two cables landing on the same
     node — and seeing it is better than being quietly prevented from
     making it. */
  function addEffect(c, targetId) {
    c.effects = c.effects || [];
    c.effects.push({ id: nextItemId(c.effects, "f"), varId: targetId || null, op: "add", amount: 1 });
    return c.effects[c.effects.length - 1];
  }
  function addCondition(c, targetId) {
    c.conditions = c.conditions || [];
    c.conditions.push({ id: nextItemId(c.conditions, "q"), varId: targetId || null, cmp: ">=", value: 0 });
    return c.conditions[c.conditions.length - 1];
  }
  function addChoice(sceneId) {
    var s = data.scenes[sceneId];
    var n = 1;
    while ((s.choices || []).some(function (c) { return c.id === "c" + n; })) n++;
    s.choices = s.choices || [];
    s.choices.push({ id: "c" + n, label: "New choice", target: null, points: 0, feedback: "" });
    ui.sel = sceneId;
    saveDraft(); render();
  }
  function deleteNode(id) {
    if (isVar(id)) return deleteVariable(id);
    if (isReroute(id)) return deleteReroute(id);
    return deleteScene(id);
  }
  /* Removing a bend straightens the cable rather than cutting it:
     whatever pointed at this reroute now points at whatever it
     pointed at. Nothing is lost, so it needs no confirmation. */
  function deleteReroute(id) {
    var onward = data.reroutes[id].target || null;
    sceneList().forEach(function (s) {
      (s.choices || []).forEach(function (c) {
        if (c.target === id) c.target = onward;
        (c.effects || []).forEach(function (f) { if (f.varId === id) f.varId = onward; });
        (c.conditions || []).forEach(function (q) { if (q.varId === id) q.varId = onward; });
      });
    });
    rerouteList().forEach(function (o) { if (o.target === id) o.target = onward; });
    delete data.reroutes[id];
    ui.sel = null;
    saveDraft(); render();
  }
  function deleteVariable(id) {
    var v = data.vars[id], refs = 0;
    sceneList().forEach(function (s) {
      (s.choices || []).forEach(function (c) {
        refs += (c.effects || []).filter(function (f) { return resolveTarget(f.varId) === id; }).length;
        refs += (c.conditions || []).filter(function (q) { return resolveTarget(q.varId) === id; }).length;
      });
    });
    var name = v.label || v.key;
    askConfirm(
      "Delete the variable “" + name + "”?",
      refs
        ? refs + (refs > 1 ? " effects and conditions use it. All of them" : " effect or condition uses it. It") + " will be removed too."
        : "Nothing uses it.",
      "Delete variable",
      function () {
        sceneList().forEach(function (s) {
          (s.choices || []).forEach(function (c) {
            if (c.effects) c.effects = c.effects.filter(function (f) { return resolveTarget(f.varId) !== id; });
            if (c.conditions) c.conditions = c.conditions.filter(function (q) { return resolveTarget(q.varId) !== id; });
          });
        });
        rerouteList().forEach(function (r) { if (r.target === id) r.target = null; });
        delete data.vars[id];
        ui.sel = null;
        saveDraft(); render();
        toast("Deleted “" + name + "”");
      }
    );
  }
  function deleteScene(id) {
    var s = data.scenes[id];
    var name = s.name || id;
    var inbound = 0;
    sceneList().forEach(function (o) {
      (o.choices || []).forEach(function (c) { if (c.target === id) inbound++; });
    });
    rerouteList().forEach(function (r) { if (r.target === id) inbound++; });

    askConfirm(
      "Delete “" + name + "”?",
      inbound
        ? inbound + (inbound > 1 ? " connections point" : " connection points") +
          " at this scene. They stay in place but stop leading anywhere, and the checks will list them."
        : "Nothing points at this scene.",
      "Delete scene",
      function () {
        sceneList().forEach(function (o) {
          (o.choices || []).forEach(function (c) { if (c.target === id) c.target = null; });
        });
        rerouteList().forEach(function (r) { if (r.target === id) r.target = null; });
        delete data.scenes[id];
        if (data.start === id) data.start = Object.keys(data.scenes)[0] || null;
        ui.sel = null;
        saveDraft(); render();
        toast("Deleted “" + name + "”");
      }
    );
  }
  function autoLayout() {
    var depth = {}, order = [];
    var queue = data.start ? [[data.start, 0]] : [];
    while (queue.length) {
      var pair = queue.shift(), id = pair[0], d = pair[1];
      if (!data.scenes[id] || (depth[id] != null && depth[id] >= d)) continue;
      depth[id] = d;
      if (order.indexOf(id) < 0) order.push(id);
      (data.scenes[id].choices || []).forEach(function (c) { if (c.target) queue.push([c.target, d + 1]); });
    }
    sceneList().forEach(function (s) { if (depth[s.id] == null) { depth[s.id] = 0; order.push(s.id); } });
    var cols = {};
    order.forEach(function (id) {
      var d = depth[id];
      cols[d] = cols[d] || [];
      if (cols[d].indexOf(id) < 0) cols[d].push(id);
    });
    Object.keys(cols).forEach(function (d) {
      cols[d].forEach(function (id, i) {
        data.scenes[id].x = 200 + Number(d) * 340;
        data.scenes[id].y = 160 + i * 210;
      });
    });
    saveDraft(); render();
    requestAnimationFrame(fitView);
  }
