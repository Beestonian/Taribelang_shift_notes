  /* ============================================================
     PLAY MODE
     ============================================================ */
  function startRun() {
    var vars = {};
    varList().forEach(function (v) { vars[v.id] = Number(v.start) || 0; });
    run = { at: resolveTarget(data.start) || data.start, path: [], score: 0, lastFeedback: "", vars: vars, deltas: {} };
  }

  /* One choice, applied in order: every effect on it moves its
     variable, then the result is clamped to that variable's own
     min/max. Deltas are kept for one render so the HUD can show
     what just moved. */
  function applyEffects(c) {
    run.deltas = {};
    (c.effects || []).forEach(function (fx) {
      var v = varOf(fx.varId);
      if (!v) return;
      var before = Number(run.vars[v.id]) || 0;
      var a = Number(fx.amount) || 0;
      var next = before;
      if (fx.op === "add") next = before + a;
      else if (fx.op === "sub") next = before - a;
      else if (fx.op === "set") next = a;
      else if (fx.op === "mul") next = before * a;
      else if (fx.op === "div") next = a === 0 ? before : before / a;
      if (v.min !== "" && v.min != null) next = Math.max(Number(v.min), next);
      if (v.max !== "" && v.max != null) next = Math.min(Number(v.max), next);
      run.vars[v.id] = next;
      if (next !== before) run.deltas[v.id] = next - before;
    });
  }

  function choiceVisible(c) {
    return (c.conditions || []).every(function (q) {
      var v = varOf(q.varId);
      var cur = v && run.vars ? run.vars[v.id] : null;
      if (cur == null) return true;
      var t = Number(q.value) || 0;
      if (q.cmp === ">") return cur > t;
      if (q.cmp === ">=") return cur >= t;
      if (q.cmp === "<") return cur < t;
      if (q.cmp === "<=") return cur <= t;
      if (q.cmp === "==") return cur === t;
      if (q.cmp === "!=") return cur !== t;
      return true;
    });
  }

  /* {{key}} anywhere in the learner-facing text reads the live value. */
  function interp(t) {
    if (!t) return t;
    return String(t).replace(/\{\{\s*(\w+)\s*\}\}/g, function (m, key) {
      var v = varByKey(key);
      if (!v) return m;
      return fmtVar(v, run.vars ? run.vars[v.id] : v.start);
    });
  }
  function buildPlayer() {
    var wrap = el("div", "player");
    var inner = el("div", "player-inner");
    var s = run.at ? data.scenes[run.at] : null;

    if (!s) {
      var e = el("div", "insp-empty");
      e.innerHTML = "<p>This scenario has no opening scene yet.</p>";
      inner.appendChild(e);
      wrap.appendChild(inner);
      return wrap;
    }

    /* progress rail */
    var total = Object.keys(data.scenes).length;
    var prog = el("div", "prog");
    prog.appendChild(el("span", null, "STEP " + String(run.path.length + 1).padStart(2, "0")));
    var track = el("div", "track"); var fill = el("div", "fill");
    fill.style.width = Math.min(100, ((run.path.length + 1) / Math.max(3, total * 0.6)) * 100) + "%";
    track.appendChild(fill); prog.appendChild(track);
    if (maxScore() > 0) prog.appendChild(el("span", null, (run.score >= 0 ? "+" : "") + run.score));
    inner.appendChild(prog);

    var shown = varList().filter(function (v) { return v.show; });
    if (shown.length) {
      var hud = el("div", "vars-hud");
      shown.forEach(function (v) {
        var d = run.deltas ? run.deltas[v.id] : 0;
        var chip = el("div", "vchip" + (d ? " moved" : ""));
        chip.appendChild(el("span", "vl", v.label || v.key));
        chip.appendChild(el("span", "vv", fmtVar(v, run.vars[v.id])));
        if (d) chip.appendChild(el("span", "vd", (d > 0 ? "+" : "−") + fmtVar(v, Math.abs(d))));
        hud.appendChild(chip);
      });
      inner.appendChild(hud);
    }

    var kind = s.type === "question" ? "Decision" : s.type === "ending" ? "Outcome" : "Briefing";
    inner.appendChild(el("div", "scene-kind", kind));

    if (s.title) inner.appendChild(el("h1", null, interp(s.title)));

    if (run.lastFeedback) {
      var fb = el("div", "feedback", interp(run.lastFeedback));
      inner.appendChild(fb);
    }

    if (s.body) {
      var prose = el("div", "scene-prose");
      prose.innerHTML = sanitize(interp(s.body));
      inner.appendChild(prose);
    }

    if (s.image || s.video) {
      var media = el("div", "scene-media");
      if (s.image) { var im = el("img"); im.src = s.image; im.alt = s.title || ""; media.appendChild(im); }
      var v = videoEmbed(s.video);
      if (v) {
        var box = el("div", "vid");
        var fr = document.createElement("iframe");
        fr.src = v; fr.title = s.title || "Video";
        fr.setAttribute("allow", "accelerometer; encrypted-media; picture-in-picture; fullscreen");
        fr.setAttribute("allowfullscreen", "");
        box.appendChild(fr); media.appendChild(box);
      }
      inner.appendChild(media);
    }

    if (s.type === "ending") {
      inner.appendChild(buildEnding());
    } else {
      var offered = (s.choices || []).filter(choiceVisible);
      if (!offered.length) {
        var none = el("div", "no-options");
        none.textContent = (s.choices || []).length
          ? "There is nothing you can do from here — every option needs a condition you haven't met."
          : "This scene has no choices yet.";
        inner.appendChild(none);
      } else {
        var box2 = el("div", "choices");
        offered.forEach(function (c, i) {
          var b = el("button", "choice-btn");
          b.appendChild(el("span", "key", String(i + 1)));
          b.appendChild(el("span", "txt", interp(c.label) || "Continue"));
          var dst = resolveTarget(c.target);
          b.disabled = !dst || !data.scenes[dst];
          if (b.disabled) { b.title = "This choice isn't connected to anything yet."; b.style.opacity = ".5"; }
          b.addEventListener("click", function () { take(s, c); });
          box2.appendChild(b);
        });
        inner.appendChild(box2);
      }
    }

    wrap.appendChild(inner);
    return wrap;
  }

  function take(scene, choice) {
    var dest = resolveTarget(choice.target);
    if (!dest || !data.scenes[dest]) return;
    run.path.push({ scene: scene.name || scene.id, label: interp(choice.label), points: choice.points || 0 });
    run.score += choice.points || 0;
    applyEffects(choice);
    run.lastFeedback = choice.feedback || "";
    run.at = dest;
    render();
    var p = document.querySelector(".player");
    if (p) p.scrollTop = 0;
  }

  function buildEnding() {
    var frag = document.createDocumentFragment();
    var max = maxScore();
    if (max > 0) {
      var card = el("div", "ending-score");
      var n = el("span", "n", (run.score >= 0 ? "" : "−") + Math.abs(run.score));
      if (run.score >= max * 0.7) n.style.color = "var(--ok)";
      else if (run.score < 0) n.style.color = "var(--danger)";
      card.appendChild(n);
      card.appendChild(el("span", "of", "of " + max + " available"));
      card.appendChild(el("div", "sp"));
      card.appendChild(el("span", "of", run.path.length + " decisions"));
      frag.appendChild(card);
    }
    if (run.path.length) {
      var lbl = el("div", "scene-kind", "The path you took");
      lbl.style.marginTop = "18px";
      frag.appendChild(lbl);
      var ul = el("ul", "path-list");
      run.path.forEach(function (p, i) {
        var li = el("li");
        li.appendChild(el("span", "step", String(i + 1).padStart(2, "0")));
        li.appendChild(el("span", null, p.label));
        li.appendChild(el("div", "bar-sp"));
        if (p.points) li.appendChild(el("span", "pt", (p.points > 0 ? "+" : "") + p.points));
        ul.appendChild(li);
      });
      frag.appendChild(ul);
    }
    var acts = el("div", "player-actions");
    acts.appendChild(btn("Start again", function () { startRun(); render(); }, null, "btn btn-primary"));
    frag.appendChild(acts);
    return frag;
  }

  /* ============================================================
     EXPORT / IMPORT
     ============================================================ */
  function buildFile() {
    var json = JSON.stringify(data, null, 2).replace(/<\//g, "<\\/");
    return PRISTINE.replace(
      /(<script id="scenario-data"[^>]*>)[\s\S]*?(<\/script>)/,
      function (m, open, close) { return open + "\n" + json + "\n" + close; }
    );
  }
  function slug() {
    return (data.title || "scenario").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "scenario";
  }
  function blobDownload(text, filename, type) {
    try {
      var blob = new Blob([text], { type: type });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }

  /* Saving a file works differently in the two places this file runs.
     Hosted on your own server it is an ordinary download link. Inside
     the claude.ai viewer a page is never allowed to save on its own —
     the host mediates it and the viewer confirms. Detect which one we
     are in rather than assuming, because it is the same file both
     times, and an exported copy has no host at all. */
  function saveFile(text, filename, type) {
    var host = window.claude && typeof window.claude.use === "function" ? window.claude : null;
    if (!host) { fallback(); return; }
    host.use("downloads").then(function (dl) {
      if (!dl) { fallback(); return; }
      dl.save({ filename: filename, data: text }).then(
        function () { toast("Saved " + filename); },
        function (err) {
          var code = err && err.code;
          if (code === "declined") return;                 /* they said no; leave it */
          if (code === "rate_limited") { toast("A save prompt is already open."); return; }
          if (code === "rejected_extension" || code === "extension_not_enabled") {
            toast("This viewer won't save .html files. Use Copy HTML instead.");
            return;
          }
          fallback();
        }
      );
    }, fallback);
    function fallback() {
      if (!blobDownload(text, filename, type)) {
        toast("This preview blocks downloads — use Copy HTML instead.");
      }
    }
  }

  function openExport() {
    var file = buildFile();
    var kb = Math.round(file.length / 1024);
    var dlg = makeDialog(
      "Export this scenario",
      "You get one HTML file — player and builder together. Host it, then point a Rise embed block at its address."
    );
    var body = dlg.querySelector(".dlg-body");

    var steps = el("ol", "steps");
    steps.innerHTML =
      "<li>Download <code>" + esc(slug()) + ".html</code> (about " + kb + " KB).</li>" +
      "<li>Put it anywhere that serves files over HTTPS — your LMS, SharePoint, S3, Netlify.</li>" +
      "<li>In Rise: <strong>Embed</strong> block → paste <code>&lt;iframe src=\"…\" width=\"100%\" height=\"760\" style=\"border:0\"&gt;&lt;/iframe&gt;</code>.</li>" +
      "<li>To edit it again later, open the same file with <code>?edit</code> on the end of the address.</li>";
    body.appendChild(steps);

    var note = el("div", "note");
    note.innerHTML = "<b>If the download is refused or does nothing</b>, you are in a viewer that won't save files. Copy the text below into a new file named <code>" + esc(slug()) + ".html</code> instead — it is exactly the same thing.";
    body.appendChild(note);

    var ta = el("textarea", "code");
    ta.value = file;
    ta.readOnly = true;
    ta.setAttribute("aria-label", "Exported HTML");
    body.appendChild(ta);

    var foot = dlg.querySelector("footer");
    foot.appendChild(btn("Copy JSON only", function () {
      copyText(JSON.stringify(data, null, 2), "Scenario JSON copied.");
    }, "Just the content, to paste into another copy"));
    foot.appendChild(btn("Copy HTML", function () {
      copyText(file, "Full HTML copied — paste it into a new .html file.");
    }));
    foot.appendChild(btn("Download " + slug() + ".html", function () {
      saveFile(file, slug() + ".html", "text/html");
    }, null, "btn btn-primary"));
  }

  function openImport() {
    var dlg = makeDialog("Import a scenario", "Paste the JSON from another copy. This replaces everything currently on the canvas.");
    var body = dlg.querySelector(".dlg-body");
    var ta = el("textarea", "code");
    ta.placeholder = '{ "title": …, "start": …, "scenes": { … } }';
    ta.setAttribute("aria-label", "Scenario JSON");
    body.appendChild(ta);
    var msg = el("div", "help");
    body.appendChild(msg);
    var foot = dlg.querySelector("footer");
    foot.appendChild(btn("Replace everything", function () {
      var parsed;
      try { parsed = JSON.parse(ta.value); }
      catch (e) { msg.textContent = "That isn't valid JSON — " + e.message; msg.style.color = "var(--danger)"; return; }
      if (!parsed || !parsed.scenes || typeof parsed.scenes !== "object") {
        msg.textContent = "No “scenes” object in there. This doesn't look like a Switchback scenario.";
        msg.style.color = "var(--danger)"; return;
      }
      data = normalise(parsed); ui.sel = null; saveDraft(); closeDialog(); render();
    }, null, "btn btn-primary"));
  }

  function copyText(text, ok) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(ok); }, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(ok); }
      catch (e) { toast("Couldn't copy — select the text and copy it by hand."); }
      ta.remove();
    }
  }
  function toast(msg) {
    var t = el("div", null, msg);
    t.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;" +
      "background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:5px;font-size:12.5px;box-shadow:var(--shadow-md)";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  var openScrim = null;
  function makeDialog(title, sub) {
    closeDialog();
    var scrim = el("div", "scrim");
    var dlg = el("div", "dlg");
    dlg.setAttribute("role", "dialog");
    dlg.setAttribute("aria-modal", "true");
    var head = el("header");
    head.appendChild(el("h2", null, title));
    if (sub) head.appendChild(el("p", null, sub));
    dlg.appendChild(head);
    dlg.appendChild(el("div", "dlg-body"));
    var foot = el("footer");
    foot.appendChild(btn("Close", closeDialog, null, "btn btn-quiet"));
    dlg.appendChild(foot);
    scrim.appendChild(dlg);
    scrim.addEventListener("pointerdown", function (e) { if (e.target === scrim) closeDialog(); });
    document.body.appendChild(scrim);
    openScrim = scrim;
    return dlg;
  }
  function closeDialog() {
    if (openScrim) { openScrim.remove(); openScrim = null; }
  }

  /* Never call confirm/alert/prompt. A sandboxed iframe that was not
     granted allow-modals returns false from confirm() immediately and
     shows nothing — so every guarded action silently declines itself.
     That is true of the claude.ai viewer and may well be true of the
     Rise embed, so the page has to own its own dialogs. */
  function askConfirm(title, message, okLabel, onOk, tone) {
    var dlg = makeDialog(title, message);
    var foot = dlg.querySelector("footer");
    var ok = btn(okLabel || "Delete", function () { closeDialog(); onOk(); }, null,
      tone === "primary" ? "btn btn-primary" : "btn btn-danger");
    foot.appendChild(ok);
    setTimeout(function () { ok.focus(); }, 0);
  }
  function askText(title, message, value, onOk) {
    var dlg = makeDialog(title, message);
    var body = dlg.querySelector(".dlg-body");
    var i = el("input");
    i.type = "text";
    i.value = value || "";
    i.setAttribute("aria-label", title);
    body.appendChild(i);
    function accept() { var v = i.value; closeDialog(); onOk(v); }
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); accept(); } });
    dlg.querySelector("footer").appendChild(btn("OK", accept, null, "btn btn-primary"));
    setTimeout(function () { i.focus(); i.select(); }, 0);
  }

  /* ============================================================
     KEYBOARD
     ============================================================ */
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.key === "Escape") { if (openScrim) { closeDialog(); return; } if (!typing && ui.sel) { ui.sel = null; refreshSelection(); } return; }
    if (openScrim) return;   /* a dialog owns the keyboard while it is open */
    if (typing) return;

    if (mode === "play") {
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) {
        var btns = document.querySelectorAll(".choice-btn");
        if (btns[n - 1] && !btns[n - 1].disabled) btns[n - 1].click();
      }
      return;
    }
    if ((e.key === "Delete" || e.key === "Backspace") && ui.sel) { e.preventDefault(); deleteNode(ui.sel); }
    if (e.key === "f" || e.key === "F") fitView();
    if (e.key === "n" || e.key === "N") addScene("content");
    if (e.key === "v" || e.key === "V") addVariable();
    if (e.key === "r" || e.key === "R") { addReroute(); saveDraft(); render(); }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  if (mode === "play") startRun();
  render();
  if (mode === "edit") requestAnimationFrame(function () { requestAnimationFrame(fitView); });
  try { if (mode === "edit") sessionStorage.setItem("switchback:from-edit", "1"); } catch (e) {}
})();
</script>

</body>
</html>
